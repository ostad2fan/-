        --bg-light: #f9fafb; /* gray-50 */
        --text-light: #111827; /* gray-900 */
        --card-bg-light: #ffffff;
        --card-border-light: #e5e7eb; /* gray-200 */

        --card-border-dark: #374151; /* gray-700 */

        --input-border-dark: #4b5563; /* gray-600 */

        --table-header-bg-dark: #1f2937;
        --table-row-hover-dark: #1f2937;
        --text-muted-dark: #9ca3af;

        font-family: 'Vazirmatn', sans-serif;
        background-color: var(--bg-light);
        color: var(--text-light);
        transition: background-color 0.3s, color 0.3s;

      html.dark body {
        background-color: var(--bg-dark);
        color: var(--text-dark);
      }
      /* Prevent scroll on number inputs */
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button {
          -webkit-appearance: none;
          margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield; /* Firefox */
      }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: flex-start; /* Changed for long modals */
            z-index: 50;
            transition: opacity 300ms;
            overflow-y: auto; /* Allow page to scroll */
        }
        #raw-material-action-modal, #completion-modal, #wip-report-modal {
            z-index: 60; /* Ensure action modals are on top of other modals */
        }
        .modal-content {
            background-color: var(--card-bg-light);
            border: 1px solid var(--card-border-light);
            color: var(--text-light);
            border-radius: 0.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 42rem; /* lg */
            margin: 2rem 1rem; /* Added top/bottom margin */
            padding: 1.5rem;
            transform: scale(0.95);
            opacity: 0;
            animation: fade-in-scale 0.2s forwards;
            /* max-height: 90vh; */ /* Removed */
            display: flex;
            flex-direction: column;
        }
        html.dark .modal-content {
           background-color: var(--card-bg-dark);
           border-color: var(--card-border-dark);
           color: var(--text-dark);
        }
        @keyframes fade-in-scale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .print-header {
            display: none;
        }

        .destination-hidden .wip-destination-col {
            display: none;
        }
        .scrap-notes-hidden .wip-scrap-notes-col {
            display: none;
        }
        
        .form-input, .form-select {
          background-color: var(--input-bg-light);
          border: 1px solid var(--input-border-light);
          color: var(--text-light);
          border-radius: 0.5rem;
          padding: 0.5rem 0.75rem;
        }
        html.dark .form-input, html.dark .form-select {
          background-color: var(--input-bg-dark);
          border-color: var(--input-border-dark);
          color: var(--text-dark);
        }

        @media print {
            body.is-printing #app-container > *:not(.is-printing) {
                display: none !important;
            }

            .no-print {
                display: none !important;
            }

            html, body {
                background-color: white !important;
                color: black !important;
            }
             html.dark, html.dark body {
                 background-color: white !important;
                color: black !important;
             }
             
            table, th, td {
                border: 1px solid #ccc !important;
            }

            .modal-content-print {
                overflow: visible !important;
                height: auto !important;
                max-height: none !important;
            }

            .modal.is-printing {
                display: block !important;
                position: absolute !important;
                top: 0;
                left: 0;
                width: 100% !important;
                height: auto !important;
                background: white !important;
                z-index: 9999 !important;
                overflow-y: visible !important;
            }

            .modal.is-printing .modal-content {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                max-height: none !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                background-color: white !important;
                color: black !important;
                transform: none !important;
                opacity: 1 !important;
                animation: none !important;
            }
            html.dark .modal.is-printing .modal-content * {

            }


            .print-header {
                display: block !important;
                text-align: center;
                margin-bottom: 1.5rem;

    <script type="module">
        const urlParams = new URLSearchParams(window.location.search);
        const canEdit = urlParams.get('canEdit') === 'true';
        const panelMode = urlParams.get('panelMode');
        const user = urlParams.get('user');

        // This is a standalone app running in an iframe.
        // It needs its own theme synchronization with the parent if possible.
        document.addEventListener('DOMContentLoaded', () => {
            // Function to apply theme based on parent's class
            const syncTheme = () => {
                try {
                    const parentHtml = window.top.document.documentElement;
                    if (parentHtml.classList.contains('dark')) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                } catch (e) {
                    console.warn("Cross-origin frame error, falling back to default dark theme.");
                    if (!document.documentElement.classList.contains('dark') && !document.documentElement.classList.contains('light')) {
                         document.documentElement.classList.add('dark');
                    }
                }
            };

            // UX: Prevent mouse wheel from changing number inputs
            document.addEventListener('wheel', (event) => {
                if (document.activeElement.type === 'number' && document.activeElement === event.target) {
                    event.preventDefault();
                    document.activeElement.blur();
                }
            }, { passive: false });

            // Initial sync
            syncTheme();

            // Observe parent for changes to ensure the theme is always in sync
            try {
                 const observer = new MutationObserver(syncTheme);
                 observer.observe(window.top.document.documentElement, { attributes: true, attributeFilter: ['class'] });
            } catch (e) {
                console.warn("Could not observe parent window for theme changes.");
            }
        });

        // --- API CLIENT ---
        const api = {
            async request(endpoint, options = {}) {
                const { body, ...customConfig } = options;
                const headers = { 'Content-Type': 'application/json' };

                if (panelMode === 'personal' && user) {
                    headers['X-User-DB'] = user;
                }

                const config = {
                    method: body ? 'POST' : 'GET',
                    ...customConfig,
                    headers: { ...headers, ...customConfig.headers },
                };
                if (body) config.body = JSON.stringify(body);

                try {
                    const response = await fetch(endpoint, config);
                    if (!response.ok) {
                        const contentType = response.headers.get("content-type");
                        if (contentType && contentType.indexOf("application/json") !== -1) {
                            const errorData = await response.json();
                             throw new Error(errorData.error || `Request failed with status ${response.status}`);
                        } else {
                            const errorText = await response.text();
                            throw new Error(errorText || `Request failed with status ${response.status}`);
                        }
                    }
                    if (response.status === 204) return null; // No Content
                     const contentType = response.headers.get("content-type");
                    if (contentType && contentType.indexOf("application/json") !== -1) {
                        return response.json();
                    }
                    return response.text(); // Handle non-JSON responses like "OK"
                } catch (error) {
                    alert(`خطای شبکه: ${error.message}`);
                    return Promise.reject(error);
                }
            },

        // --- UTILITY FUNCTIONS ---
        const normalizeSearchString = (str) => {
          if (str === null || str === undefined) return '';
          let s = String(str).trim();

          // Persian/Arabic character normalization
          s = s.replace(/[ي]/g, 'ی').replace(/[ك]/g, 'ک').replace(/[آأإ]/g, 'ا');

          // Convert Persian/Arabic numerals to Latin numerals
          const numeralsMap = { '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4', '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9', '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9' };
          s = s.replace(/[۰-۹٠-٩]/g, char => numeralsMap[char]);

          // Collapse multiple whitespace characters into a single space
          s = s.replace(/\s+/g, ' ');

          // Convert to lowercase for case-insensitive comparison
          return s.toLowerCase();
        };

        const toShamsiDisplay = (dateStr) => {
            if (!dateStr) return '';
            try {
                return new Date(dateStr).toLocaleDateString('fa-IR');

            }
        };

        const getPart = (partId) => state.parts.find(p => p.id === partId);
        const getWipJob = (jobId) => state.workInProgressJobs.find(j => j.id === jobId);
        const getWorkshop = (workshopId) => state.workshops.find(w => w.id === workshopId);
        const getSortedWorkshops = () => [...state.workshops].sort((a, b) => a.name.localeCompare(b.name, 'fa'));
        const getRawMaterial = (rmId) => state.rawMaterials.find(rm => rm.id === rmId);
        
        const getRawMaterialStock = (rmId) => {
            return state.rawMaterialTransactions
                .filter(tx => tx.rawMaterialId === rmId)
                .reduce((stock, tx) => {
                    if (tx.type === RawMaterialTransactionType.PURCHASE) return stock + tx.quantity;
                    if (tx.type === RawMaterialTransactionType.CONSUME) return stock - tx.quantity;
                    return stock;
                }, 0);
        };
        
        const getWorkshopRawMaterialStock = (workshopId, rmId) => {
            const consumedTxs = state.rawMaterialTransactions
                .filter(tx => tx.workshopId === workshopId && tx.rawMaterialId === rmId && tx.type === RawMaterialTransactionType.CONSUME)
                .reduce((sum, tx) => sum + tx.quantity, 0);

            const productionsForRmInWorkshop = state.workInProgressJobs
                .filter(job => job.workshopId === workshopId && job.rawMaterialId === rmId)
                .flatMap(job => job.productions);
            
            const usedInProduction = productionsForRmInWorkshop.reduce((sum, p) => {
                const part = getPart(p.partId);
                let consumedWeight = 0;
                if (part?.weightDefinition) {
                    consumedWeight = (p.producedQty / part.weightDefinition.baseQuantity) * part.weightDefinition.baseWeight;
                }
                return sum + consumedWeight + p.scrapQuantity;
            }, 0);

            const completedJobs = state.workInProgressJobs.filter(job => job.workshopId === workshopId && job.rawMaterialId === rmId && job.status === WipStatus.COMPLETED && job.completionAction);
            const returnedOrScrapped = completedJobs.reduce((sum, job) => sum + (job.completionAction.returnQty || 0) + (job.completionAction.scrapQty || 0), 0);

            return consumedTxs - usedInProduction - returnedOrScrapped;
        }

        const calculateLotRemainders = (workshopId, rmId) => {
            // 1. Get all consumption 'lots' for this material in this workshop, sorted oldest first.
            const allConsumptions = state.rawMaterialTransactions
                .filter(tx => tx.workshopId === workshopId && tx.rawMaterialId === rmId && tx.type === 'مصرف')
                .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)) // Oldest first
                .map(tx => ({ ...tx, remaining: tx.quantity })); // Initialize 'remaining' property

            // 2. Get all jobs that use this material in this workshop.
            const allJobsForPair = state.workInProgressJobs.filter(j => j.workshopId === workshopId && j.rawMaterialId === rmId);
            
            // 3. Calculate total material usage (what's not remaining and not returned) across all these jobs.
            let totalUsage = 0;
            allJobsForPair.forEach(job => {
                // Usage from productions
                (job.productions || []).forEach(p => {
                    const part = getPart(p.partId);
                    let consumedWeight = 0;
                    if (part?.weightDefinition) {
                        consumedWeight = (p.producedQty / part.weightDefinition.baseQuantity) * part.weightDefinition.baseWeight;
                    }
                    totalUsage += consumedWeight;
                    totalUsage += p.scrapQuantity;
                });
                // Usage from completion
                if (job.status === 'COMPLETED' && job.completionAction) {
                    totalUsage += (job.completionAction.scrapQty || 0);
                    // Note: returned quantity is handled implicitly by not being part of usage.
                }
            });

            // 4. Apply FIFO deduction
            for (const lot of allConsumptions) {
                if (totalUsage <= 1e-9) break; // Float tolerance
                const consumedFromThisLot = Math.min(totalUsage, lot.remaining);
                lot.remaining -= consumedFromThisLot;
                totalUsage -= consumedFromThisLot;
            }
            
            return allConsumptions;
        };

            const handleClick = (e) => (e.target === modalEl || e.target.closest('[data-action="close-modal"]')) && closeModalHandler();

            document.addEventListener('keydown', handleEsc);
            modalEl.addEventListener('click', handleClick);

            modalEl._escListener = handleEsc;
            modalEl._clickListener = handleClick;
        };

                const totalProduced = (job.productions || []).reduce((sum, p) => sum + p.producedQty, 0);
                if (!isNaN(producedQtyFilter) && producedQtyFilter > 0 && totalProduced < producedQtyFilter) {
                    return false;
                }
                
                return true;
            });
            
            const pendingJobs = filteredJobs
                .filter(job => job.status === WipStatus.PENDING)

                    } else {

        const generateProductionReport = () => {

            const selectedWorkshops = Array.from(document.querySelectorAll('#workshop-multiselect-menu input:checked')).map(cb => cb.value);

            const reportTitle = `گزارش جامع تولید (${toShamsiDisplay(startDate)} تا ${toShamsiDisplay(endDate)})`;

            printBtn.disabled = false;
            printBtn.onclick = () => printModal(DOM.productionReportModal.el);

            const container = DOM.productionReportModal.body.querySelector('#production-report-table-container');

            const reportData = state.workInProgressJobs.map(job => {
                const consumptions = state.rawMaterialTransactions
                    .filter(tx => tx.wipJobId === job.id && tx.type === 'مصرف')
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    
                if (consumptions.length === 0) return null;
    
                const workshopMatch = selectedWorkshops.length === 0 || selectedWorkshops.includes(job.workshopId);
                const rawMaterialMatch = selectedRawMaterials.length === 0 || selectedRawMaterials.includes(job.rawMaterialId);
                const dateMatch = consumptions.some(tx => {
                    const txDate = tx.timestamp.substring(0, 10);
                    return txDate >= startDate && txDate <= endDate;
                });
                const statusMatch = statusFilter === 'all' || job.status === statusFilter;
    
                if (!workshopMatch || !rawMaterialMatch || !dateMatch || !statusMatch) return null;
                
                const workshop = getWorkshop(job.workshopId);
                const rawMaterial = getRawMaterial(job.rawMaterialId);
                const productions = job.productions || [];
                const producedPartsInfo = productions.map(p => ({
                    part: getPart(p.partId),
                    qty: p.producedQty,
                    scrap: p.scrapQuantity,
                    scrapNotes: p.scrapNotes,
                    destinationWorkshopId: p.destinationWorkshopId
                }));
                const totalScrap = productions.reduce((sum, p) => sum + p.scrapQuantity, 0);
                const totalConsumedWeight = productions.reduce((sum, p) => {
                    const part = getPart(p.partId);
                    if (part?.weightDefinition) return sum + (p.producedQty / part.weightDefinition.baseQuantity) * part.weightDefinition.baseWeight;
                    return sum;
                }, 0);
                const remaining = job.consumedQuantity - totalConsumedWeight - totalScrap;

                return {
                    job, workshop, rawMaterial, producedPartsInfo,
                    totalConsumedWeight, totalScrap, remaining,
                    consumptions: consumptions,
                    latestConsumptionTimestamp: new Date(consumptions[0].timestamp), // Latest is first
                    isMultiDispatch: consumptions.length > 1
                };
            }).filter(Boolean).sort((a,b) => b.latestConsumptionTimestamp - a.latestConsumptionTimestamp);

            if (reportData.length === 0) {

                return;
            }

            let totalConsumedWeightSum = 0;
            let totalScrapSum = 0;
            let totalRemainingSum = 0;
            let totalDispatchedRawMaterialSum = 0;
            reportData.forEach(d => {
                totalConsumedWeightSum += d.totalConsumedWeight;
                totalScrapSum += d.totalScrap;
                if (d.job.status === 'PENDING') { // Only sum remaining for pending jobs
                    totalRemainingSum += d.remaining;
                }
                totalDispatchedRawMaterialSum += d.job.consumedQuantity;
            });

            const headers = ["کارگاه", "ماده اولیه (ارسالی)", "قطعات تولیدی"];
            if (showDestination) headers.push('مقصد تولید');
            headers.push("وزن مصرفی", "ضایعات");
            if (showScrapNotes) headers.push('توضیحات ضایعات');
            headers.push("باقیمانده", "وضعیت");

            let footerCellsHTML = '';
            headers.forEach((h, i) => {
                let content = '';
                let cellClass = 'px-2 py-3 border border-slate-300 dark:border-slate-600';

                if (i === 0) {
                    content = 'جمع کل';
                } else if (h === 'ماده اولیه (ارسالی)') {
                    content = totalDispatchedRawMaterialSum.toLocaleString('fa-IR', { maximumFractionDigits: 2 });
                    cellClass += ' text-center font-mono';
                } else if (h === 'وزن مصرفی') {
                    content = totalConsumedWeightSum.toLocaleString('fa-IR', { maximumFractionDigits: 2 });
                    cellClass += ' text-center font-mono';
                } else if (h === 'ضایعات') {
                    content = totalScrapSum.toLocaleString('fa-IR', { maximumFractionDigits: 2 });
                    cellClass += ' text-center font-mono';
                } else if (h === 'باقیمانده') {
                    content = totalRemainingSum.toLocaleString('fa-IR', { maximumFractionDigits: 2 });
                    cellClass += ' text-center font-mono';
                }
                
                footerCellsHTML += `<td class="${cellClass}">${content}</td>`;
            });

            container.innerHTML = `
            <div class="overflow-x-auto">
                <table id="production-report-table" class="w-full text-sm text-right border-collapse border border-slate-300 dark:border-slate-600">
                    <thead class="text-xs text-slate-700 dark:text-slate-300 uppercase bg-slate-100 dark:bg-slate-800/80 sticky top-0 backdrop-blur-sm z-10">
                        <tr>${headers.map(h => `<th class="px-2 py-3 border border-slate-300 dark:border-slate-600">${h}</th>`).join('')}</tr>
                        <tr class="filter-row no-print">${headers.map((h, i) => `<th class="p-1 font-normal align-top border border-slate-300 dark:border-slate-600"><input type="search" placeholder="جستجو..." data-column-index="${i}" class="w-full text-xs p-1.5 border border-slate-300 dark:border-slate-500 rounded bg-white dark:bg-slate-800 focus:ring-1 focus:ring-indigo-500"></th>`).join('')}</tr>
                    </thead>
                    <tbody class="bg-white dark:bg-slate-800">
                    ${reportData.map(d => {
                        const statusClass = d.job.status === 'COMPLETED' ? 'bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-300' : 'bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300';
                        const statusText = d.job.status === 'COMPLETED' ? 'تکمیل' : 'در جریان';
                        
                        let remainingText;
                        if (d.job.status === 'COMPLETED' && typeof d.job.completionAction === 'object' && d.job.completionAction !== null) {
                            const { returnQty, scrapQty } = d.job.completionAction;
                            let parts = [];
                            if (returnQty > 0) parts.push(`<span class="text-xs text-slate-500 dark:text-slate-400">بازگشت: ${returnQty.toFixed(3)}</span>`);
                            if (scrapQty > 0) parts.push(`<span class="text-xs text-slate-500 dark:text-slate-400">ضایعات نهایی: ${scrapQty.toFixed(3)}</span>`);
                            remainingText = parts.length > 0 ? parts.join('<br>') : '-';
                        } else {
                            remainingText = `<span class="font-mono ${d.remaining < 0 ? 'text-red-500' : ''}">${d.remaining.toFixed(2)} ${d.rawMaterial?.unit || ''}</span>`;
                        }

                        const cells = [
                            `<td class="px-2 py-2 font-semibold text-blue-600 dark:text-blue-400 border border-slate-300 dark:border-slate-600">${d.workshop?.name || ''}</td>`,
                            `<td class="px-2 py-2 border border-slate-300 dark:border-slate-600">
                                <div>${d.rawMaterial?.name || ''}</div>
                                <div class="text-xs space-y-1 mt-1 border-t border-slate-200 dark:border-slate-700 pt-1">
                                    ${d.consumptions.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp)).map(tx => `
                                        <div>
                                            <span class="font-mono">${tx.quantity.toLocaleString('fa-IR')} ${d.rawMaterial?.unit || ''}</span>
                                            <span class="text-slate-500 dark:text-slate-400">(${new Date(tx.timestamp).toLocaleDateString('fa-IR')})</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </td>`,
                            `<td class="px-2 py-2 border border-slate-300 dark:border-slate-600">${
                                d.producedPartsInfo.map(item => {
                                    if (item.qty > 0) {
                                        return `<div>${item.qty.toLocaleString('fa-IR')} × ${item.part?.name || 'قطعه حذف شده'}</div>`;
                                    } else if (item.scrap > 0) {
                                        return `<div class="text-sm italic text-slate-500 dark:text-slate-400">ضایعات ثبت شده</div>`;
                                    }
                                    return '';
                                }).filter(Boolean).join('') || '-'
                            }</td>`
                        ];

                        if (showDestination) {
                            const destinations = [...new Set(d.producedPartsInfo.map(item => getWorkshop(item.destinationWorkshopId)?.name || 'نامشخص'))].join(', ');
                            cells.push(`<td class="px-2 py-2 border border-slate-300 dark:border-slate-600 text-xs">${destinations}</td>`);
                        }
                        
                        cells.push(
                            `<td class="px-2 py-2 font-mono text-center border border-slate-300 dark:border-slate-600">${d.totalConsumedWeight.toFixed(2)}</td>`,
                            `<td class="px-2 py-2 font-mono text-center border border-slate-300 dark:border-slate-600">${d.totalScrap.toFixed(2)}</td>`
                        );
                        
                        if (showScrapNotes) {
                            const notes = d.producedPartsInfo.map(p => p.scrapNotes).filter(Boolean).join('; ');
                            cells.push(`<td class="px-2 py-2 text-xs italic border border-slate-300 dark:border-slate-600">${notes || '-'}</td>`);
                        }
                        
                        cells.push(
                            `<td class="px-2 py-2 border border-slate-300 dark:border-slate-600">${remainingText}</td>`,
                            `<td class="px-2 py-2 text-center border border-slate-300 dark:border-slate-600"><span class="px-2 py-1 rounded-full text-xs font-semibold ${statusClass}">${statusText}</span></td>`
                        );
                        
                        return `<tr class="${d.isMultiDispatch ? 'bg-yellow-50 dark:bg-yellow-900/30' : ''}">${cells.join('')}</tr>`;
                    }).join('')}
                    </tbody>
                    <tfoot class="bg-slate-200 dark:bg-slate-900/50 font-bold text-base">
                        <tr>
                            ${footerCellsHTML}
                        </tr>
                    </tfoot>
                </table>
                </div>
            `;

            const table = DOM.productionReportModal.body.querySelector('#production-report-table');
            const filterInputs = table.querySelectorAll('.filter-row input');
            filterInputs.forEach(input => {
                input.addEventListener('input', () => {
                    const filters = Array.from(filterInputs).map(i => ({ index: i.dataset.columnIndex, value: normalizeSearchString(i.value) }));
                    table.querySelectorAll('tbody tr').forEach(row => {
                        const isVisible = filters.every(f => {
                            if (!f.value) return true;
                            const cell = row.children[f.index];
                            return cell && normalizeSearchString(cell.textContent).includes(f.value);
                        });
                        row.style.display = isVisible ? '' : 'none';
                    });
                });
            });
        };
        // --- INITIALIZATION ---
        const setupEventListeners = () => {
            // Header buttons
            DOM.openWorkshopsBtn.disabled = !canEdit;
            DOM.openRawMaterialsBtn.disabled = !canEdit;

            DOM.openWorkshopsBtn.addEventListener('click', () => { state.editingWorkshopId = null; renderWorkshopsModal(); });
            DOM.openRawMaterialsBtn.addEventListener('click', renderRawMaterialsModal);
            DOM.openProductionReportBtn.addEventListener('click', openProductionReportModal);
            
            // WIP container action delegation
            DOM.wipContainer.addEventListener('click', (e) => {
                const button = e.target.closest('button[data-action]');
                if (!button) return;

                const wipId = button.closest('[data-wip-id]')?.dataset.wipId;
                const job = getWipJob(wipId);
                state.selectedWipJob = job;

                switch(button.dataset.action) {
                    case 'record-production': job && renderRecordProductionModal(job); break;
                    case 'complete-wip-job': job && renderCompletionModal(job); break;
                    case 'wip-report': job && renderWipReportModal(); break;
                    case 'delete-wip-job': job && deleteWipJob(job.id); break;
                }
            });

            // Filter listeners
            DOM.wipSearchInput.addEventListener('input', renderWipContent);
            DOM.wipConsumedQtyFilter.addEventListener('input', renderWipContent);
            DOM.wipProducedQtyFilter.addEventListener('input', renderWipContent);
        };

        const init = async () => {
             DOM.wipContainer.innerHTML = `<div class="text-center p-8 bg-white dark:bg-slate-800 rounded-lg shadow-md"><p class="font-semibold">در حال بارگذاری اطلاعات از سرور...</p></div>`;
            try {
                const data = await api.bootstrap();
                state.parts = data.parts || [];
                state.workshops = data.workshops || [];
                state.wages = data.wages || {};
                state.rawMaterials = data.rawMaterials || [];
                state.rawMaterialTransactions = data.rawMaterialTransactions || [];
                state.workInProgressJobs = data.wipJobs || [];
                setupEventListeners();
                renderWipContent();
            } catch (error) {
                 DOM.wipContainer.innerHTML = `<div class="text-center p-8 bg-white dark:bg-slate-800 rounded-lg shadow-md"><p class="text-red-500 font-semibold">خطا در بارگذاری اطلاعات از سرور.<br/>${error.message}</p></div>`;
            }
        };

        init();
    </script>
</body>
</html>
