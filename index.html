                                              <td className="px-4 py-3 text-center">{tx.quantityChange.toLocaleString()}</td>
                                              <td className="px-4 py-3 text-center">{tx.weightChangeKg.toFixed(2)} کیلوگرم</td>
                                              <td className="px-4 py-3 text-center">{new Date(tx.timestamp).toLocaleString('fa-IR')}</td>
                                              <td className="px-4 py-3 text-center">{tx.snapshotQuantity.toLocaleString()} / {tx.snapshotWeightKg.toFixed(2)} ک‌گ</td>
                                          </tr>
                                      )
                                  }) : (
                                      <tr><td colSpan={5} className="text-center py-10 text-gray-500 dark:text-gray-400">هیچ تراکنشی برای این کالا و فیلتر یافت نشد.</td></tr>
                                  )}
                              </tbody>
                          </table>
                      </div>
                  </div>
              </Modal>
          );
      };

      const InventoryList = ({ parts, searchTerm, permissions, onEdit, onDelete, onHistory, newlyReorderedPartIds }) => {
          const filteredParts = useMemo(() =>
              parts
                  .filter(p => normalizeSearchString(p.name).includes(normalizeSearchString(searchTerm)))
                  .sort((a, b) => {
                      const getRank = (part, isNew) => {
                          if (isNew) return 0; // Highest priority
                          if (part.reorderPoint > 0 && part.quantity <= part.reorderPoint) return 1; // Second priority
                          return 2; // Lowest priority
                      };

                      const aIsNewlyReordered = newlyReorderedPartIds.has(a.id);
                      const bIsNewlyReordered = newlyReorderedPartIds.has(b.id);

                      const rankA = getRank(a, aIsNewlyReordered);
                      const rankB = getRank(b, bIsNewlyReordered);

                      if (rankA !== rankB) {
                          return rankA - rankB;
                      }

                      if (rankA < 2) {
                          const dateA = a.reorderTriggeredDate ? new Date(a.reorderTriggeredDate).getTime() : 0;
                          const dateB = b.reorderTriggeredDate ? new Date(b.reorderTriggeredDate).getTime() : 0;
                          if (dateB !== dateA) {
                              return dateB - dateA; 
                          }
                      }
                      
                      return a.name.localeCompare(b.name, 'fa');
                  }),
              [parts, searchTerm, newlyReorderedPartIds]
          );
          
          const canEdit = permissions[Permission.CAN_EDIT_ITEMS];
          const canDelete = permissions[Permission.CAN_DELETE_ITEMS];

          if (parts.length === 0 && !searchTerm) {
              return <div className="text-center py-16"><p className="text-gray-500 dark:text-gray-400">انبار خالی است. یک کالای جدید اضافه کنید.</p></div>;
          }
          
          return (
              <div className="overflow-y-auto max-h-[calc(100vh-450px)] relative border-x border-b border-gray-200 dark:border-gray-700 rounded-b-lg">
                  <table className="min-w-full text-sm">
                      <thead className="border-b border-gray-200 dark:border-gray-700 bg-gray-100/80 dark:bg-gray-900/80 backdrop-blur-sm sticky top-0 z-10">
                          <tr>
                              <th scope="col" className="px-4 py-3 text-right text-sm font-semibold">نام کالا</th>
                              <th scope="col" className="px-4 py-3 text-center text-sm font-semibold">تعداد</th>
                              <th scope="col" className="px-4 py-3 text-center text-sm font-semibold">وزن کل (ک‌گ)</th>
                              <th scope="col" className="px-4 py-3 text-center text-sm font-semibold">تعداد/ک‌گ</th>
                              <th scope="col" className="px-4 py-3 text-center text-sm font-semibold">نقطه سفارش</th>
                              <th scope="col" className="px-4 py-3 text-right text-sm font-semibold pr-6">عملیات</th>
                          </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100 dark:divide-gray-800">
                          {filteredParts.map(part => {
                              const totalWeight = (part.itemsPerKg > 0) ? (Number(part.quantity)/Number(part.itemsPerKg)) : 0;
                              const isNewlyReordered = newlyReorderedPartIds.has(part.id);
                              const needsReorder = part.reorderPoint > 0 && part.quantity <= part.reorderPoint;
                              
                              const rowClass = isNewlyReordered 
                                ? 'bg-amber-400/10 dark:bg-amber-800/20' 
                                : needsReorder 
                                  ? 'bg-red-500/10 dark:bg-red-900/30' 
                                  : '';

                              return (
                                  <tr key={part.id} className={`hover:bg-gray-100 dark:hover:bg-gray-800/50 ${rowClass}`}>
                                      <td className="px-4 py-4 font-medium whitespace-nowrap text-right">
                                          {part.name}
                                          {needsReorder && part.reorderTriggeredDate && (
                                              <span className="mr-2 text-xs font-normal text-yellow-600 dark:text-yellow-400">
                                                  ({new Date(part.reorderTriggeredDate).toLocaleDateString('fa-IR')})
                                              </span>
                                          )}
                                          {isNewlyReordered && <span className="ml-2 px-2 py-0.5 rounded-full bg-amber-500 text-white text-xs font-bold animate-pulse">جدید</span>}
                                      </td>
                                      <td className="px-4 py-4 text-center">{(part.quantity || 0).toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
                                      <td className="px-4 py-4 text-center">{totalWeight.toFixed(2)}</td>
                                      <td className="px-4 py-4 text-center">{(part.itemsPerKg || 0).toLocaleString(undefined, {maximumFractionDigits: 2})}</td>
                                      <td className={`px-4 py-4 font-semibold text-center ${needsReorder ? 'text-yellow-500 dark:text-yellow-400' : ''}`}>{(part.reorderPoint || 0).toLocaleString()}</td>
                                      <td className="px-4 py-4 text-right whitespace-nowrap pr-6">
                                          <div className="flex justify-end items-center gap-4">
                                              <button onClick={() => onHistory(part)} className="text-cyan-600 hover:text-cyan-500 dark:text-cyan-400 dark:hover:text-cyan-300 font-semibold">تاریخچه</button>
                                              {canEdit && <button onClick={() => onEdit(part)} className="text-purple-600 hover:text-purple-500 dark:text-purple-400 dark:hover:text-purple-300 font-semibold">ویرایش</button>}
                                              {canDelete && <button onClick={() => onDelete(part.id)} className="text-red-600 hover:text-red-500 dark:text-red-500 dark:hover:text-red-400 font-semibold">حذف</button>}
                                          </div>
                                      </td>
                                  </tr>
                              )
                          })}
                      </tbody>
                  </table>
                  {filteredParts.length === 0 && searchTerm && (
                      <div className="text-center py-10 text-gray-500 dark:text-gray-400">هیچ کالایی با این مشخصات یافت نشد.</div>
                  )}
              </div>
          );
      };

      const GlobalHistory = ({ transactions }) => {
          const getTodayString = () => new Date().toLocaleDateString('en-CA');
          const [dateRange, setDateRange] = useState({ start: '', end: '' });
          const [searchTerm, setSearchTerm] = useState('');
          const [operationFilter, setOperationFilter] = useState('all');
          
          useEffect(() => {
              const today = getTodayString();
              setDateRange({ start: today, end: today });
          }, []);
          
          const toShamsiDisplay = (dateStr) => {
              if (!dateStr) return '';
              try {
                  return new Date(dateStr).toLocaleDateString('fa-IR');
              } catch (e) {
                  return 'تاریخ نامعتبر';
              }
          };

          const displayedTransactions = useMemo(() => {
              if (!transactions) return [];
              const { start: startDate, end: endDate } = dateRange;
              const normalizedSearch = normalizeSearchString(searchTerm);

              const filtered = transactions.filter(tx => {
                      const txDate = tx.timestamp.substring(0, 10);
                      if (startDate && txDate < startDate) return false;
                      if (endDate && txDate > endDate) return false;
                      if (operationFilter !== 'all' && tx.operation !== operationFilter) return false;
                      if (normalizedSearch && !normalizeSearchString(tx.partName).includes(normalizedSearch)) return false;
                      return true;
                  });
              
              return filtered.sort((a, b) => new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime());
          }, [transactions, dateRange, searchTerm, operationFilter]);

          return (
              <Card className="mt-8">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-4">
                      <h3 className="text-xl font-bold self-start shrink-0">تاریخچه کل عملیات</h3>
                       <div className="flex items-end gap-4 flex-wrap w-full sm:w-auto sm:justify-end">
                          <div className="flex-grow sm:flex-grow-0">
                                <FormInput 
                                    label="جستجوی کالا"
                                    id="global-history-search"
                                    type="search" 
                                    placeholder="نام کالا..."
                                    value={searchTerm} 
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full"
                                />
                          </div>
                          <div className="flex-grow sm:flex-grow-0">
                              <FormSelect
                                  label="نوع عملیات"
                                  id="global-history-operation"
                                  value={operationFilter}
                                  onChange={e => setOperationFilter(e.target.value)}
                                  className="w-full"
                              >
                                  <option value="all">همه</option>
                                  <option value="ورود">ورود</option>
                                  <option value="خروج">خروج</option>
                              </FormSelect>
                          </div>
                          <div>
                                <label htmlFor="global-history-start-date" className="flex justify-between items-baseline text-sm font-medium mb-1">
                                    <span>از تاریخ</span>
                                    <span className="font-normal text-xs text-gray-500 dark:text-gray-400">{toShamsiDisplay(dateRange.start)}</span>
                                </label>
                                <input 
                                    id="global-history-start-date" 
                                    type="date" 
                                    value={dateRange.start} 
                                    onChange={(e) => setDateRange(prev => ({ ...prev, start: e.target.value }))}
                                    className="block w-full px-3 py-2 rounded-lg border text-base form-input transition w-full sm:w-auto"
                                />
                          </div>
                          <div>
                                <label htmlFor="global-history-end-date" className="flex justify-between items-baseline text-sm font-medium mb-1">
                                    <span>تا تاریخ</span>
                                    <span className="font-normal text-xs text-gray-500 dark:text-gray-400">{toShamsiDisplay(dateRange.end)}</span>
                                </label>
                                <input
                                    id="global-history-end-date" 
                                    type="date" 
                                    value={dateRange.end} 
                                    onChange={(e) => setDateRange(prev => ({ ...prev, end: e.target.value }))}
                                    className="block w-full px-3 py-2 rounded-lg border text-base form-input transition w-full sm:w-auto"
                                />
                          </div>
                      </div>
                  </div>
                  <div className="overflow-x-auto">
                      <table className="min-w-full text-sm">
                          <thead className="bg-gray-100 dark:bg-gray-700/50">
                              <tr>
                                  <th scope="col" className="px-4 py-3 text-right text-sm font-semibold">کالا</th>
                                  <th scope="col" className="px-4 py-3 text-center text-sm font-semibold">عملیات</th>
                                  <th scope="col" className="px-4 py-3 text-center text-sm font-semibold">مقدار (تعداد)</th>
                                  <th scope="col" className="px-4 py-3 text-center text-sm font-semibold">مقدار (وزن)</th>
                                  <th scope="col" className="px-4 py-3 text-center text-sm font-semibold">تاریخ و ساعت</th>
                                  <th scope="col" className="px-4 py-3 text-center text-sm font-semibold">موجودی لحظه‌ای</th>
                              </tr>
                          </thead>
                          <tbody className="divide-y divide-gray-100 dark:divide-gray-800">
                              {displayedTransactions.length > 0 ? displayedTransactions.map(tx => {
                                  const isEntry = tx.operation === 'ورود';
                                  return (
                                      <tr key={tx.id}>
                                          <td className="px-4 py-3 text-right whitespace-nowrap">{tx.partName}</td>
                                          <td className={`px-4 py-3 font-semibold text-center ${isEntry ? 'text-green-500' : 'text-red-500'}`}>{tx.operation}</td>
                                          <td className="px-4 py-3 text-center">{tx.quantityChange.toLocaleString()}</td>
                                          <td className="px-4 py-3 text-center">{tx.weightChangeKg.toFixed(2)} کیلوگرم</td>
                                          <td className="px-4 py-3 text-center text-gray-600 dark:text-gray-400">{new Date(tx.timestamp).toLocaleString('fa-IR')}</td>
                                          <td className="px-4 py-3 text-center whitespace-nowrap">{`${tx.snapshotQuantity.toLocaleString()} عدد / ${tx.snapshotWeightKg.toFixed(2)} ک‌گ`}</td>
                                      </tr>
                                  );
                              }) : (
                                  <tr><td colSpan={6} className="text-center py-10 text-gray-500 dark:text-gray-400">هیچ تراکنشی برای فیلترهای انتخاب شده یافت نشد.</td></tr>
                              )}
                          </tbody>
                      </table>
                  </div>
              </Card>
          );
      };

      const ReportModal = ({ isOpen, onClose, reportData }) => {
          if (!isOpen) return null;

          const handleDownload = () => {
              if (!reportData || !window.XLSX) return;
              const worksheet = XLSX.utils.aoa_to_sheet([reportData.headers, ...reportData.data]);
              worksheet['!props'] = { rtl: true };
              const workbook = XLSX.utils.book_new();
              XLSX.utils.book_append_sheet(workbook, worksheet, "Report");
              XLSX.writeFile(workbook, reportData.filename || "report.xlsx");
          };

          const handlePrint = () => {
              if (!reportData) return;
              const { headers, data, title } = reportData;
              const printHtml = `<html><head><title>چاپ گزارش</title><style>@font-face {font-family: 'Vazirmatn';src: url(data:font/woff2;base64,d09GMgABAAAAADEsAA...); /* FONT DATA TRUNCATED FOR BREVITY */} body{font-family: Vazirmatn, sans-serif;} table{width:100%; border-collapse:collapse;} th,td{border:1px solid #ccc; padding:8px; text-align:center;} thead{background-color: #f2f2f2;}</style></head><body onload="window.print();window.close()"><div dir="rtl" lang="fa"><h1 style="text-align: center;">${title}</h1><p style="text-align: center;">تاریخ: ${new Date().toLocaleString('fa-IR')}</p><table border="1"><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${data.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div></body></html>`;
              const printWindow = window.open('', '_blank');
              if(printWindow) { printWindow.document.write(printHtml); printWindow.document.close(); printWindow.focus(); }
          };
          
          return (
              <Modal isOpen={isOpen} onClose={onClose} size="md" position="top">
                  <div className="p-4 text-center">
                      <h2 className="text-2xl font-bold mb-2">عملیات گزارش</h2>
                      <p className="text-gray-500 dark:text-gray-400 mb-6">گزارش <span className="font-semibold text-gray-700 dark:text-gray-300">{reportData?.filename}</span> آماده است.</p>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          <button onClick={handlePrint} className="w-full flex items-center justify-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700"><svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v-2a1 1 0 011-1h8a1 1 0 011 1v2h1a2 2 0 002-2v-3a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clipRule="evenodd" /></svg><span>چاپ</span></button>
                          <button onClick={handleDownload} className="w-full flex items-center justify-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700"><svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clipRule="evenodd" /></svg><span>دانلود XLSX</span></button>
                      </div>
                      <button onClick={onClose} className="mt-8 py-2 px-8 border border-gray-300 dark:border-gray-600 rounded-lg text-sm font-medium bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">بستن</button>
                  </div>
              </Modal>
          );
      };

      const ImportModal = ({ isOpen, onClose, onImport }) => {
          const [dragOver, setDragOver] = useState(false);
          const [error, setError] = useState('');
          
          const handleFile = (file) => {
              setError('');
              if (!file || !window.XLSX) return;

              const reader = new FileReader();
              reader.onload = (e) => {
                  try {
                      if (!e.target?.result || !(e.target.result instanceof ArrayBuffer)) return;
                      const data = new Uint8Array(e.target.result);
                      const workbook = XLSX.read(data, { type: 'array' });
                      const sheetName = workbook.SheetNames[0];
                      const worksheet = workbook.Sheets[sheetName];
                      const json = XLSX.utils.sheet_to_json(worksheet, { defval: null });
                      
                      if (json.length === 0) throw new Error("فایل اکسل خالی است.");

                      const headerMapping = {
                          'name': { key: 'name' }, 'نام کالا': { key: 'name' },
                          'quantity': { key: 'quantity' }, 'تعداد': { key: 'quantity' },
                          'itemsperkg': { key: 'itemsPerKg' }, 'تعداد در کیلوگرم': { key: 'itemsPerKg' },
                          'totalweightkg': { key: 'itemsPerKg'}, 'وزن': { key: 'itemsPerKg' },
                          'reorderpoint': { key: 'reorderPoint' }, 'نقطه سفارش': { key: 'reorderPoint' },
                          'dailyusage': { key: 'dailyUsage' }, 'میانگین مصرف روزانه': { key: 'dailyUsage' },
                          'leadtime': { key: 'leadTime' }, 'زمان تحویل (روز)': { key: 'leadTime' },
                          'safetystockdays': { key: 'safetyStockDays' }, 'موجودی اطمینان (روز)': { key: 'safetyStockDays' }
                      };
                      const fileHeaders = Object.keys(json[0]);
                      const foundHeaders = {};

                      fileHeaders.forEach(h => {
                          const mappingKey = h ? h.toLowerCase().trim().replace(/\s/g, '') : '';
                          const mapping = headerMapping[mappingKey];
                          if(mapping) {
                              if (mapping.key === 'itemsPerKg' && (mappingKey === 'totalweightkg' || mappingKey === 'وزن')) {
                                 foundHeaders['totalWeightKg'] = h;
                              } else {
                                 foundHeaders[mapping.key] = h;
                              }
                          }
                      });

                      if (!foundHeaders.name) throw new Error("ستون ضروری 'name' یا 'نام کالا' یافت نشد.");

                      const parsedItems = json.map((row) => {
                          const name = row[foundHeaders.name]?.toString().trim();
                          if (!name) return null;
                          
                          let itemsPerKg = parseFloat(row[foundHeaders.itemsPerKg]) || 0;
                          const quantity = parseFloat(row[foundHeaders.quantity]) || 0;
                          const totalWeightKg = parseFloat(row[foundHeaders.totalWeightKg]) || 0;

                          if(itemsPerKg <= 0) {
                              if(quantity > 0 && totalWeightKg > 0) {
                                  itemsPerKg = quantity / totalWeightKg;
                              } else {
                                  itemsPerKg = 1; // Default fallback
                              }
                          }
                          
                          return {
                              name,
                              quantity,
                              itemsPerKg,
                              reorderPoint: parseInt(row[foundHeaders.reorderPoint], 10) || 0,
                              dailyUsage: parseFloat(row[foundHeaders.dailyUsage]) || 0,
                              leadTime: parseFloat(row[foundHeaders.leadTime]) || 0,
                              safetyStockDays: parseFloat(row[foundHeaders.safetyStockDays]) || 0,
                              baseCount: itemsPerKg,
                              baseWeight: 1,
                          }
                      }).filter(Boolean);

                      onImport(parsedItems);
                      onClose();

                  } catch (err) {
                      setError(`خطا در پردازش فایل: ${err.message}`);
                  }
              };
              reader.readAsArrayBuffer(file);
          };
          
          const handleDragEvents = (e, isOver) => { e.preventDefault(); e.stopPropagation(); setDragOver(isOver); };
          const handleDrop = (e) => {
              handleDragEvents(e, false);
              const files = e.dataTransfer.files;
              if (files && files.length > 0) { handleFile(files[0]); }
          };

          return (
              <Modal isOpen={isOpen} onClose={onClose} size="lg" position="top">
                  <div className="p-4">
                      <h2 className="text-2xl font-bold mb-6 text-center">وارد کردن کالا از فایل</h2>
                      <div className="p-4 bg-gray-100 dark:bg-gray-900/50 rounded-lg text-sm text-gray-500 dark:text-gray-400 mb-6">
                          <p className="font-bold mb-2 text-gray-700 dark:text-gray-200">راهنما:</p>
                          <p>فایل اکسل (XLSX) یا CSV خود را انتخاب کنید. فایل باید دارای یک ستون با عنوان `name` یا `نام کالا` در ردیف اول باشد.</p>
                          <ul className="list-disc list-inside my-2 font-mono text-xs grid grid-cols-2 md:grid-cols-3 gap-x-4">
                              <li>name / نام کالا <span className="text-red-500">(الزامی)</span></li>
                              <li>quantity / تعداد</li>
                              <li>totalWeightKg / وزن</li>
                              <li>itemsPerKg / تعداد در کیلوگرم</li>
                              <li>reorderPoint / نقطه سفارش</li>
                              <li>dailyUsage / میانگین مصرف روزانه</li>
                              <li>leadTime / زمان تحویل (روز)</li>
                              <li>safetyStockDays / موجودی اطمینان (روز)</li>
                          </ul>
                      </div>
                      <label 
                          htmlFor="file-upload" 
                          className={`w-full cursor-pointer bg-gray-50 dark:bg-gray-900/50 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-10 text-center hover:border-blue-500 transition-colors flex flex-col items-center justify-center ${dragOver ? 'drag-over' : ''}`}
                          onDragOver={(e) => handleDragEvents(e, true)}
                          onDragLeave={(e) => handleDragEvents(e, false)}
                          onDragEnd={(e) => handleDragEvents(e, false)}
                          onDrop={handleDrop}
                      >
                          <svg xmlns="http://www.w3.org/2000/svg" className="mx-auto h-12 w-12 text-gray-400 dark:text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
                          <span className="mt-2 block text-sm font-semibold text-gray-700 dark:text-gray-300">برای انتخاب فایل کلیک کنید یا فایل را اینجا بکشید</span>
                          <span className="mt-1 block text-xs text-gray-500 dark:text-gray-500">Excel (XLS, XLSX) or CSV</span>
                      </label>
                      <input id="file-upload" type="file" className="sr-only" accept=".xlsx,.xls,.csv" onChange={(e) => { const target = e.target; if(target.files && target.files.length > 0) handleFile(target.files[0])} } />
                      {error && <p className="text-red-500 dark:text-red-400 text-center mt-4 text-sm">{error}</p>}
                      <div className="mt-8 flex justify-center gap-4">
                          <button onClick={onClose} className="py-2 px-8 border border-gray-300 dark:border-gray-600 rounded-lg text-sm font-medium bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">انصراف</button>
                      </div>
                  </div>
              </Modal>
          );
      };

      const SettingsModal = ({ isOpen, onClose, currentUser, users, onUpdateUser, setUsers, setToast }) => {
          const [activeTab, setActiveTab] = useState('profile');
          const [username, setUsername] = useState(currentUser.username);
          const [displayName, setDisplayName] = useState(currentUser.displayName || '');
          const [password, setPassword] = useState('');
          const [confirmPassword, setConfirmPassword] = useState('');
          const [error, setError] = useState('');
          
          const canViewUsers = currentUser.permissions[Permission.CAN_VIEW_USERS] || currentUser.permissions[Permission.CAN_EDIT_USERS];

          useEffect(() => {
              if (isOpen) {
                  setUsername(currentUser.username);
                  setDisplayName(currentUser.displayName || '');
                  setPassword('');
                  setConfirmPassword('');
                  setError('');
                  setActiveTab('profile');
              }
          }, [isOpen, currentUser]);

          const handleProfileSubmit = async (e) => {
              e.preventDefault();
              setError('');
              if (password && password !== confirmPassword) {
                  setError('رمزهای عبور جدید مطابقت ندارند.');
                  return;
              }
              if (users.some(u => u.username === username && u.id !== currentUser.id)) {
                  setError('این نام کاربری توسط کاربر دیگری استفاده شده است.');
                  return;
              }
              try {
                await onUpdateUser(currentUser.id, { username, displayName: displayName || null, password: password || undefined });
                setToast({message: 'اطلاعات کاربری با موفقیت بروزرسانی شد.', type: 'success'});
                onClose();
              } catch(err) {
                setError(err.message);
                setToast({message: `خطا: ${err.message}`, type: 'error'});
              }
          };

          const tabButtonClass = (tabName) => `px-4 py-2 text-sm font-semibold border-b-2 transition-colors ${activeTab === tabName ? 'border-blue-500 text-blue-600 dark:text-blue-400' : 'border-transparent text-gray-500 hover:border-gray-300 dark:hover:border-gray-600 hover:text-gray-700 dark:hover:text-gray-300'}`;

          return (
              <Modal isOpen={isOpen} onClose={onClose} size="xl" position="top">
                  <div className="flex justify-between items-center p-5 border-b border-gray-200 dark:border-gray-700">
                      <h3 className="text-xl font-bold">تنظیمات</h3>
                      <IconButton onClick={onClose} className="-mt-2 -mr-2">
                          <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                      </IconButton>
                  </div>

                  <div className="border-b border-gray-200 dark:border-gray-700">
                      <nav className="flex space-x-4 space-x-reverse px-5 -mb-px">
                          <button onClick={() => setActiveTab('profile')} className={tabButtonClass('profile')}>اطلاعات کاربری</button>
                          {canViewUsers && <button onClick={() => setActiveTab('users')} className={tabButtonClass('users')}>مدیریت کاربران</button>}
                      </nav>
                  </div>
                  
                  {activeTab === 'profile' && (
                      <form onSubmit={handleProfileSubmit}>
                          <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                              <div className="space-y-6">
                                  <h4 className="text-lg font-semibold border-b border-gray-200 dark:border-gray-700 pb-2">تغییر اطلاعات کاربری</h4>
                                  <FormInput label="نام نمایشی" id="settings-display-name" value={displayName} onChange={e => setDisplayName(e.target.value)} placeholder="مثلا: حسابداری" />
                                  <FormInput label="نام کاربری (برای ورود)" id="settings-username" value={username} onChange={e => setUsername(e.target.value)} required />
                                  <FormInput label="رمز عبور جدید (اختیاری)" id="settings-password" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="برای تغییر، رمز جدید را وارد کنید" />
                                  <FormInput label="تکرار رمز عبور جدید" id="settings-confirm-password" type="password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} disabled={!password} />
                                  {error && <p className="text-sm text-red-500 dark:text-red-400">{error}</p>}
                              </div>
                              <div className="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-lg h-fit">
                                  <h4 className="font-bold text-slate-800 dark:text-slate-100 mb-4 text-base">اطلاعات تماس</h4>
                                  <ul className="space-y-2 text-slate-600 dark:text-slate-300 text-sm">
                                      <li className="flex gap-2"><strong className="font-semibold">آدرس:</strong><span>قهجاورستان، کوی صنعت، جنب پارکینگ شهرداری</span></li>
                                      <li className="flex gap-2"><strong className="font-semibold">تلفن تماس:</strong><span dir="ltr">۰۳۱-۳۵۷۷۷۱۰۵ / ۰۳۱-۳۵۷۷۷۱۰۶</span></li>
                                      <li className="flex gap-2"><strong className="font-semibold">تلفن همراه:</strong><span dir="ltr">۰۹۱۳۵۰۲۴۸۱۴</span></li>
                                      <li className="flex gap-2"><strong className="font-semibold">ایمیل:</strong><span dir="ltr">noyanniro@gmail.com</span></li>
                                  </ul>
                                  <p className="text-xs text-center text-slate-400 dark:text-slate-500 mt-4">شرکت نویان نیرو سپاهان</p>
                              </div>
                          </div>
                          <div className="flex justify-end gap-3 p-4 bg-gray-50 dark:bg-gray-900/50 border-t border-gray-200 dark:border-gray-700 rounded-b-lg">
                              <button type="button" onClick={onClose} className="py-2 px-5 rounded-lg bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-white transition text-sm font-semibold">انصراف</button>
                              <PrimaryButton type="submit" className="w-auto px-6">ذخیره تغییرات</PrimaryButton>
                          </div>
                      </form>
                  )}
                  {activeTab === 'users' && canViewUsers && (
                      <div className="p-6 max-h-[70vh] overflow-y-auto">
                           <UserManagementPage users={users} setUsers={setUsers} currentUser={currentUser} setToast={setToast}/>
                      </div>
                  )}
              </Modal>
          );
      };

      const UserManagementPage = ({ users, setUsers, currentUser, setToast }) => {
          const [localUsers, setLocalUsers] = useState(() => JSON.parse(JSON.stringify(users)));
          const [newUsername, setNewUsername] = useState('');
          const [newPassword, setNewPassword] = useState('');
          const [newDisplayName, setNewDisplayName] = useState('');
          const [error, setError] = useState('');
          
          const canEditUsers = currentUser.permissions[Permission.CAN_EDIT_USERS];

          const [now, setNow] = useState(Date.now());
          useEffect(() => {
            const timer = setInterval(() => setNow(Date.now()), 10000); 
            return () => clearInterval(timer);
          }, []);

          const PermissionGroup = ({ title, children, disabled }) => (
              <div className={`p-3 rounded-md ${disabled ? 'opacity-60' : ''}`}>
                  <h5 className="font-semibold text-sm mb-2 text-slate-800 dark:text-slate-200">{title}</h5>
                  <div className="space-y-2">{children}</div>
              </div>
          );
      
          const PermissionCheckbox = ({ pKey, user, onChange }) => {
              const isSuperAdmin = user.username === 'trade_master';
              return (
                  <label className="flex items-center gap-2 text-sm">
                      <input
                          type="checkbox"
                          checked={user.permissions[pKey] || false}
                          onChange={(e) => onChange(user.id, pKey, e.target.checked)}
                          disabled={isSuperAdmin}
                          className="h-4 w-4 rounded border-slate-300 dark:border-slate-600 text-indigo-600 focus:ring-indigo-500 disabled:cursor-not-allowed"
                      />
                      <span className="text-slate-600 dark:text-slate-300">{PERMISSION_LABELS[pKey]}</span>
                  </label>
              );
          };

          const handleAddUser = async (e) => {
              e.preventDefault(); setError('');
              if (!newUsername.trim() || !newPassword.trim()) { setError('نام کاربری و رمز عبور الزامی است.'); return; }
              if (localUsers.some(u => u.username === newUsername)) { setError('این نام کاربری قبلا استفاده شده است.'); return; }
              const newUser = { id: crypto.randomUUID(), username: newUsername, password: newPassword, displayName: newDisplayName, permissions: DEFAULT_VIEWER_PERMISSIONS, lastSeen: null };
              
              try {
                await api.addUser(newUser);
                setLocalUsers(prev => [...prev, newUser]);
                setNewUsername(''); setNewPassword(''); setNewDisplayName('');
                setToast({message: `کاربر ${newUser.username} با موفقیت ایجاد شد.`, type: 'success'});
              } catch(err) {
                  setError(err.message);
                  setToast({message: `خطا در ایجاد کاربر: ${err.message}`, type: 'error'});
              }
          };

          const handleDeleteUser = async (userIdToDelete) => {
              const userToDelete = localUsers.find(u => u.id === userIdToDelete);
              if (!userToDelete) return;
              if (userToDelete.username === 'trade_master') { setToast({message: 'کاربر اصلی سیستم قابل حذف نیست.', type: 'error'}); return; }
              if (currentUser.id === userIdToDelete) { setToast({message: 'شما نمی‌توانید حساب کاربری خودتان را حذف کنید.', type: 'error'}); return; }
              if (window.confirm(`آیا از حذف کاربر "${userToDelete.username}" اطمینان دارید؟`)) {
                  try {
                    await api.deleteUser(userIdToDelete);
                    setLocalUsers(prev => prev.filter(u => u.id !== userIdToDelete));
                    setToast({message: 'کاربر با موفقیت حذف شد.', type: 'success'});
                  } catch(err) {
                    setToast({message: `خطا در حذف کاربر: ${err.message}`, type: 'error'});
                  }
              }
          };
          
          const handlePermissionChange = (userId, permKey, value) => {
              setLocalUsers(prev => prev.map(u => {
                  if (u.id !== userId) return u;
          
                  let newPermissions = { ...u.permissions, [permKey]: value };
                  
                  const mainWarehouseEditPerms = [Permission.CAN_ADD_ITEMS, Permission.CAN_PERFORM_TRANSACTIONS, Permission.CAN_EDIT_ITEMS, Permission.CAN_DELETE_ITEMS];
          
                  if (permKey === Permission.CAN_EDIT_MAIN_WAREHOUSE) {
                      mainWarehouseEditPerms.forEach(p => newPermissions[p] = value);
                      if (value) newPermissions[Permission.CAN_VIEW_MAIN_WAREHOUSE] = true; 
                  }
                  if (permKey === Permission.CAN_VIEW_MAIN_WAREHOUSE && !value) {
                      newPermissions[Permission.CAN_EDIT_MAIN_WAREHOUSE] = false;
                      mainWarehouseEditPerms.forEach(p => newPermissions[p] = false);
                  }
          
                  if (value) {
                      if (permKey === Permission.CAN_EDIT_PRODUCTION) newPermissions[Permission.CAN_VIEW_PRODUCTION] = true;
                      if (permKey === Permission.CAN_EDIT_OUTSOURCING) newPermissions[Permission.CAN_VIEW_OUTSOURCING] = true;
                      if (permKey === Permission.CAN_EDIT_WIP_REPORT) newPermissions[Permission.CAN_VIEW_WIP_REPORT] = true;
                      if (permKey === Permission.CAN_EDIT_USERS) newPermissions[Permission.CAN_VIEW_USERS] = true;
                  } else {
                      if (permKey === Permission.CAN_VIEW_PRODUCTION) newPermissions[Permission.CAN_EDIT_PRODUCTION] = false;
                      if (permKey === Permission.CAN_VIEW_OUTSOURCING) newPermissions[Permission.CAN_EDIT_OUTSOURCING] = false;
                      if (permKey === Permission.CAN_VIEW_WIP_REPORT) newPermissions[Permission.CAN_EDIT_WIP_REPORT] = false;
                      if (permKey === Permission.CAN_VIEW_USERS) newPermissions[Permission.CAN_EDIT_USERS] = false;
                  }
                  
                  return { ...u, permissions: newPermissions };
              }));
          };

          const handleSaveChanges = async () => { 
            try {
                const updatedUsers = await api.updateAllUsers(localUsers);
                setUsers(updatedUsers);
                setToast({message: "تغییرات با موفقیت ذخیره شد.", type: 'success'}); 
            } catch(err) {
                setToast({message: `خطا در ذخیره تغییرات: ${err.message}`, type: 'error'});
            }
          };

          return (
              <div className="space-y-8">
                  <Card>
                      <h3 className="text-xl font-bold mb-4">افزودن کاربر جدید</h3>
                      <form onSubmit={handleAddUser} className="grid md:grid-cols-4 gap-4 items-end">
                          <FormInput label="نام نمایشی" id="new-user-display" type="text" value={newDisplayName} onChange={e => setNewDisplayName(e.target.value)} disabled={!canEditUsers} />
                          <FormInput label="نام کاربری" id="new-user" type="text" value={newUsername} onChange={e => setNewUsername(e.target.value)} required disabled={!canEditUsers}/>
                          <FormInput label="رمز عبور" id="new-pass" type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} required disabled={!canEditUsers}/>
                          <PrimaryButton type="submit" className="w-full" disabled={!canEditUsers}>ایجاد کاربر</PrimaryButton>
                      </form>
                      {error && <p className="text-red-500 dark:text-red-400 text-sm mt-2">{error}</p>}
                  </Card>
                  <Card>
                      <h3 className="text-xl font-bold mb-4">لیست کاربران و دسترسی‌ها</h3>
                      <div className="space-y-6">
                          {localUsers.map(user => {
                              const isOnline = user.lastSeen && (now - user.lastSeen < 60 * 1000);
                              const isSuperAdmin = user.username === 'trade_master';

                              return (
                              <div key={user.id} className="p-4 rounded-lg bg-gray-100 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700">
                                  <div className="flex justify-between items-center mb-4">
                                      <div className="flex items-center gap-3">
                                          <span className={`flex-shrink-0 w-3 h-3 rounded-full ${isOnline ? 'bg-green-500 animate-pulse-fast' : 'bg-red-500'}`} title={isOnline ? 'آنلاین' : 'آفلاین'}></span>
                                          <div>
                                            <h4 className="font-bold text-lg text-blue-500 dark:text-blue-400">{user.displayName || user.username} {user.id === currentUser.id ? '(شما)' : ''}</h4>
                                            {user.displayName && <p className="text-xs text-gray-500 dark:text-gray-400">نام کاربری: {user.username}</p>}
                                          </div>
                                      </div>
                                      <button onClick={() => handleDeleteUser(user.id)} 
                                          className="text-red-600 hover:text-red-500 dark:text-red-500 dark:hover:text-red-400 disabled:text-gray-400 dark:disabled:text-gray-500 disabled:cursor-not-allowed font-semibold text-sm"
                                          disabled={!canEditUsers || user.id === currentUser.id || user.username === 'trade_master'}>
                                          حذف
                                      </button>
                                  </div>
                                  <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                      <PermissionGroup title="انبار اصلی" disabled={!canEditUsers}>
                                        {[Permission.CAN_VIEW_MAIN_WAREHOUSE, Permission.CAN_EDIT_MAIN_WAREHOUSE].map(pKey => <PermissionCheckbox key={pKey} pKey={pKey} user={user} onChange={handlePermissionChange} />)}
                                      </PermissionGroup>
                                      <PermissionGroup title="تولید" disabled={!canEditUsers}>
                                        {[Permission.CAN_VIEW_PRODUCTION, Permission.CAN_EDIT_PRODUCTION].map(pKey => <PermissionCheckbox key={pKey} pKey={pKey} user={user} onChange={handlePermissionChange} />)}
                                      </PermissionGroup>
                                      <PermissionGroup title="برون‌سپاری" disabled={!canEditUsers}>
                                        {[Permission.CAN_VIEW_OUTSOURCING, Permission.CAN_EDIT_OUTSOURCING].map(pKey => <PermissionCheckbox key={pKey} pKey={pKey} user={user} onChange={handlePermissionChange} />)}
                                      </PermissionGroup>
                                      <PermissionGroup title="گزارش کارگاه‌ها" disabled={!canEditUsers}>
                                        {[Permission.CAN_VIEW_WIP_REPORT, Permission.CAN_EDIT_WIP_REPORT].map(pKey => <PermissionCheckbox key={pKey} pKey={pKey} user={user} onChange={handlePermissionChange} />)}
                                      </PermissionGroup>
                                      <PermissionGroup title="مدیریت کاربران" disabled={!canEditUsers}>
                                        {[Permission.CAN_VIEW_USERS, Permission.CAN_EDIT_USERS].map(pKey => <PermissionCheckbox key={pKey} pKey={pKey} user={user} onChange={handlePermissionChange} />)}
                                      </PermissionGroup>
                                  </div>
                              </div>
                          )})}
                      </div>
                      {canEditUsers && <div className="mt-6 border-t border-gray-200 dark:border-gray-700 pt-6"><PrimaryButton className="w-full" onClick={handleSaveChanges}>ذخیره تغییرات</PrimaryButton></div>}
                  </Card>
              </div>
          );
      };

      const LiveDateTime = () => {
          const [dateTime, setDateTime] = useState(new Date());
          useEffect(() => { const timer = setInterval(() => setDateTime(new Date()), 1000); return () => clearInterval(timer); }, []);
          const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
          const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
          return (<div className="text-xs text-center text-gray-600 dark:text-gray-300"><div className="font-semibold">{dateTime.toLocaleDateString('fa-IR', dateOptions)}</div><div>{dateTime.toLocaleTimeString('fa-IR', timeOptions)}</div></div>);
      };
      
      const AppHeader = ({ currentUser, handleLogout, page, setPage, panelMode, setPanelMode, onBackup, onRestore, theme, toggleTheme, setIsSettingsOpen }) => {
        const [isUserMenuOpen, setIsUserMenuOpen] = useState(false);
        const menuRef = useRef(null);
        
        const canViewProduction = currentUser.permissions[Permission.CAN_VIEW_PRODUCTION];
        const canViewOutsourcing = currentUser.permissions[Permission.CAN_VIEW_OUTSOURCING];
        const canViewWipReport = currentUser.permissions[Permission.CAN_VIEW_WIP_REPORT];
        const isSuperAdmin = currentUser.username === 'trade_master';

        useEffect(() => {
            const handleClickOutside = (event) => {
                if (menuRef.current && !menuRef.current.contains(event.target)) {
                    setIsUserMenuOpen(false);
                }
            };
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
        }, [menuRef]);
        
        const PanelButton = ({ mode, text }) => {
            const isActive = panelMode === mode;
            const activeClasses = "bg-white dark:bg-gray-800 text-blue-600 dark:text-blue-400 shadow-sm";
            const inactiveClasses = "bg-transparent text-gray-500 hover:bg-gray-200/50 dark:hover:bg-gray-700/50";
            return (
                <button 
                  onClick={() => setPanelMode(mode)}
                  className={`px-4 py-1.5 rounded-md text-sm font-bold transition-all ${isActive ? activeClasses : inactiveClasses}`}>
                  {text}
                </button>
            );
        };

        const DropdownItem = ({ icon, text, onClick }) => (
            <a href="#" onClick={(e) => { e.preventDefault(); onClick(); setIsUserMenuOpen(false); }} className="text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 block px-4 py-2 text-sm" role="menuitem">
                <div className="flex items-center gap-3">
                    {icon}
                    <span>{text}</span>
                </div>
            </a>
        );

        return (
          <header className="bg-header-light dark:bg-header-dark backdrop-blur-sm shadow-lg border-b border-gray-200 dark:border-gray-700 sticky top-0 z-40">
            <div className="container mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-16">
                  <div className="flex-shrink-0">
                      <h1 className="text-xl font-bold text-gray-900 dark:text-white whitespace-nowrap">سیستم مدیریت انبار</h1>
                  </div>
                  <div className="flex items-center gap-3 sm:gap-4">
                      <LiveDateTime />
                      {!isSuperAdmin && (
                        <div className="p-1 bg-gray-200/70 dark:bg-gray-900/70 rounded-lg flex items-center gap-1">
                          <PanelButton mode="main" text="پنل اصلی" />
                          <PanelButton mode="personal" text="پنل شخصی" />
                      </div>
                     )}
                      {isSuperAdmin && panelMode === 'main' && (
                        <Fragment>
                            <IconButton onClick={onBackup} title="ذخیره پشتیبان">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                            </IconButton>
                            <IconButton onClick={onRestore} title="بازیابی پشتیبان">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                            </IconButton>
                        </Fragment>
                      )}
                      
                      <div className="relative" ref={menuRef}>
                          <button onClick={() => setIsUserMenuOpen(prev => !prev)} className="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">

              <nav className="flex justify-center items-center gap-x-6 h-10 border-t border-gray-200/50 dark:border-gray-700/50 overflow-x-auto">

      const ProductionTrackingModal = ({ isOpen, onClose, rawMaterials, parts, transactions, workshops, rawMaterialTransactions }) => {
          const [selectedRawMaterialId, setSelectedRawMaterialId] = useState('');
          const [startDate, setStartDate] = useState(() => new Date().toLocaleDateString('en-CA'));
          const [selectedWorkshop, setSelectedWorkshop] = useState('');
          const [scrapWeight, setScrapWeight] = useState('0');
          const [selectedPartIds, setSelectedPartIds] = useState(new Set());
          const [partSearchTerm, setPartSearchTerm] = useState('');
          const [showPartResults, setShowPartResults] = useState(false);
          const [calculationResult, setCalculationResult] = useState(null);
          
          useEffect(() => {
              if (isOpen) {
                  setSelectedRawMaterialId(rawMaterials.length > 0 ? rawMaterials[0].id : '');
                  setStartDate(new Date().toLocaleDateString('en-CA'));
                  setSelectedPartIds(new Set());
                  setPartSearchTerm('');
                  setCalculationResult(null);
                  setSelectedWorkshop(workshops && workshops.length > 0 ? workshops[0].id : '');
                  setScrapWeight('0');
              }
          }, [isOpen, rawMaterials, workshops]);

          useEffect(() => {
              if (calculationResult) {
                  const scrap = parseFloat(scrapWeight) || 0;
                  setCalculationResult(prev => {
                      if (!prev) return null;
                      return { ...prev, remainder: prev.inputWeight - prev.outputWeight - scrap };
                  });
              }
          }, [scrapWeight, calculationResult?.inputWeight, calculationResult?.outputWeight]);


          const handlePartSelection = (partId) => {
              const newSet = new Set(selectedPartIds);
              if (newSet.has(partId)) newSet.delete(partId);
              else newSet.add(partId);
              setSelectedPartIds(newSet);
              setPartSearchTerm('');
              setShowPartResults(false);
          };
          const handlePartDeselection = (partId) => {
              const newSet = new Set(selectedPartIds);
              newSet.delete(partId);
              setSelectedPartIds(newSet);
          };

          const filteredParts = useMemo(() => {
              if (!partSearchTerm) return [];
              const normalized = normalizeSearchString(partSearchTerm);
              return parts.filter(p => normalizeSearchString(p.name).includes(normalized));
          }, [parts, partSearchTerm]);
          
          const handleCalculate = () => {
              if (!selectedRawMaterialId) { alert('لطفاً یک ماده اولیه انتخاب کنید.'); return; }
              if (!selectedWorkshop) { alert('لطفاً یک کارگاه انتخاب کنید.'); return; }
              
              const inputTransactions = rawMaterialTransactions.filter(tx =>
                  tx.rawMaterialId === selectedRawMaterialId &&
                  tx.workshopId === selectedWorkshop &&
                  tx.type === 'مصرف' &&
                  tx.timestamp.substring(0, 10) >= startDate
              ).sort((a, b) => new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime());

              const totalInputWeight = inputTransactions.reduce((sum, tx) => sum + tx.quantity, 0);

              const outputTransactions = transactions.filter(tx =>
                  selectedPartIds.has(tx.partId) &&
                  tx.operation === 'ورود' &&
                  tx.timestamp.substring(0, 10) >= startDate
              ).sort((a, b) => new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime());
              const totalOutputWeight = outputTransactions.reduce((sum, tx) => sum + tx.weightChangeKg, 0);

              const scrap = parseFloat(scrapWeight) || 0;
              const remainder = totalInputWeight - totalOutputWeight - scrap;

              setCalculationResult({
                  inputWeight: totalInputWeight,
                  outputWeight: totalOutputWeight,
                  remainder: remainder,
                  outputTransactions: outputTransactions,
                  inputTransactions: inputTransactions,
              });
          };
          
          const handlePrint = () => {
              const modalContent = document.querySelector('#production-tracking-modal-content');
              if (modalContent) {
                  document.body.classList.add('is-printing');
                  modalContent.closest('.modal').classList.add('is-printing');
                  window.print();
                  document.body.classList.remove('is-printing');
                  modalContent.closest('.modal').classList.remove('is-printing');
              }
          };
          
          const toShamsiDisplay = (dateStr) => {
              if (!dateStr) return '';
              try { return new Date(dateStr).toLocaleDateString('fa-IR'); } 
              catch (e) { return 'تاریخ نامعتبر'; }
          };

          return (
              <Modal isOpen={isOpen} onClose={onClose} size="xl" position="top">
                  <div id="production-tracking-modal-content">
                      <div className="print-header print-only">
                          <h2 className="text-xl font-bold">گزارش ردیابی تولید</h2>
                          <p>تاریخ چاپ: {new Date().toLocaleString('fa-IR')}</p>
                      </div>

                      <div className="flex justify-between items-center p-5 border-b border-gray-200 dark:border-gray-700 no-print">
                          <h3 className="text-xl font-bold">ردیابی تولید و محاسبه بازدهی</h3>
                          <IconButton onClick={onClose} className="-mt-2 -mr-2">
                            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                          </IconButton>
                      </div>
                      
                      <div className="p-6 space-y-8">

                              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                  <FormSelect label="ماده اولیه مبنا" id="track-raw-material" value={selectedRawMaterialId} onChange={e => setSelectedRawMaterialId(e.target.value)}>

                                          rawMaterials.map(rm => <option key={rm.id} value={rm.id}>{rm.name}</option>)
                                      ) : ( <option>ماده اولیه‌ای یافت نشد</option> )}
                                  </FormSelect>
                                  <div>
                                      <label htmlFor="track-start-date" className="flex justify-between items-baseline text-sm font-medium mb-1">
                                          <span>ردیابی از تاریخ</span>
                                          <span className="font-normal text-xs text-gray-500 dark:text-gray-400">{toShamsiDisplay(startDate)}</span>
                                      </label>
                                      <input id="track-start-date" type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="block w-full px-3 py-2 rounded-lg border text-base form-input transition" />
                                  </div>
                                  <FormSelect label="کارگاه" id="track-workshop" value={selectedWorkshop} onChange={e => setSelectedWorkshop(e.target.value)}>
                                     {workshops && workshops.length > 0 ? (
                                          workshops.map(ws => <option key={ws.id} value={ws.id}>{ws.name}</option>)
                                     ) : <option>کارگاهی یافت نشد</option>}
                                  </FormSelect>
                              </div>
                                <div className="pt-4 border-t border-gray-200 dark:border-gray-700">
                                      <label className="block text-sm font-medium mb-1">قطعات نهایی تولید شده</label>
                                       <div className="relative">
                                            <FormInput 
                                                type="search"
                                                placeholder="جستجو و افزودن قطعه..."
                                                value={partSearchTerm}
                                                onChange={e => setPartSearchTerm(e.target.value)}
                                                onFocus={() => setShowPartResults(true)}
                                                onBlur={() => setTimeout(() => setShowPartResults(false), 200)}
                                            />
                                            {showPartResults && partSearchTerm && (
                                                <div className="absolute z-20 w-full mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-md shadow-lg max-h-48 overflow-y-auto">
                                                    {filteredParts.length > 0 ? (
                                                        <ul className="py-1">
                                                            {filteredParts.map(p => (
                                                                <li key={p.id} className="px-3 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer" onMouseDown={() => handlePartSelection(p.id)}>
                                                                    {p.name}
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    ) : (
                                                        <p className="px-3 py-2 text-sm text-gray-500 dark:text-gray-400">موردی یافت نشد.</p>
                                                    )}
                                                </div>
                                            )}
                                       </div>
                                       <div className="mt-2 flex flex-wrap gap-2 min-h-[42px] bg-slate-100 dark:bg-slate-800 p-2 rounded-lg">
                                            {selectedPartIds.size > 0 ? (
                                                Array.from(selectedPartIds).map(partId => {
                                                    const part = parts.find(p => p.id === partId);
                                                    return part ? (
                                                        <span key={partId} className="flex items-center gap-2 bg-blue-600 text-white text-xs font-semibold px-3 py-1 rounded-full">
                                                            {part.name}
                                                            <button type="button" onClick={() => handlePartDeselection(partId)} className="font-bold text-lg leading-none hover:text-red-300">&times;</button>
                                                        </span>
                                                    ) : null;
                                                })
                                            ) : (
                                                <span className="text-sm text-gray-500 dark:text-gray-400 px-2">قطعه‌ای انتخاب نشده است.</span>
                                            )}
                                       </div>
                                </div>
                              <PrimaryButton onClick={handleCalculate} className="w-full mt-2 no-print">محاسبه</PrimaryButton>
                          </div>

                          {calculationResult && (
                              <div id="production-results-grid" className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                  <div id="production-summary-box" className="lg:col-span-1 p-4 border border-blue-300 dark:border-blue-700 rounded-lg space-y-4 bg-blue-50 dark:bg-gray-800/50">
                                      <h4 className="font-bold text-lg text-blue-800 dark:text-blue-200">۲. خلاصه نتایج</h4>
                                      <div className="space-y-2 text-base">
                                           <div className="flex justify-between items-center p-2 bg-gray-100 dark:bg-gray-700 rounded-md">
                                               <span className="font-semibold">کل ماده اولیه مصرفی:</span>
                                               <span className="font-mono font-bold">{calculationResult.inputWeight.toFixed(2)} ک‌گ</span>
                                           </div>
                                           <div className="flex justify-between items-center p-2 bg-gray-100 dark:bg-gray-700 rounded-md">
                                               <span className="font-semibold">وزن کل قطعات ورودی:</span>
                                               <span className="font-mono font-bold text-green-600 dark:text-green-400">{calculationResult.outputWeight.toFixed(2)} ک‌گ</span>
                                           </div>
                                           <FormInput label="ضایعات (کیلوگرم)" id="track-scrap" type="number" min="0" step="any" value={scrapWeight} onChange={e => setScrapWeight(e.target.value)} placeholder="0.0"/>
                                           <div className="flex justify-between items-center p-3 bg-blue-100 dark:bg-blue-900 rounded-md mt-2">
                                               <span className="font-bold text-lg">باقیمانده محاسبه شده:</span>
                                               <span className="font-mono font-bold text-xl text-blue-700 dark:text-blue-300">{calculationResult.remainder.toFixed(2)} ک‌گ</span>
                                           </div>
                                      </div>
                                  </div>
                                  
                                  <div id="production-tables-container" className="lg:col-span-1 space-y-8">
                                    <div id="raw-material-table-container">
                                        <h4 className="text-lg font-bold mb-2">مصرف ماده اولیه (لحاظ شده)</h4>
                                        <div className="overflow-y-auto max-h-[30vh] border border-gray-200 dark:border-gray-700 rounded-lg">
                                            <table className="min-w-full text-sm">
                                                <thead className="sticky top-0 bg-gray-100 dark:bg-gray-800">
                                                    <tr>
                                                        <th scope="col" className="px-4 py-3 text-right font-semibold">تاریخ</th>
                                                        <th scope="col" className="px-4 py-3 text-center font-semibold">مقدار مصرف</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-200 dark:divide-gray-800">
                                                    {calculationResult.inputTransactions.length > 0 ? calculationResult.inputTransactions.map(tx => (
                                                        <tr key={tx.id}>
                                                            <td className="px-4 py-3 text-xs">{new Date(tx.timestamp).toLocaleDateString('fa-IR')}</td>
                                                            <td className="px-4 py-3 text-center font-mono">{tx.quantity.toFixed(2)}</td>
                                                        </tr>
                                                    )) : (
                                                        <tr>
                                                            <td colSpan={2} className="text-center py-10 text-gray-500 dark:text-gray-400">موردی یافت نشد.</td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div id="finished-goods-table-container">
                                        <h4 className="text-lg font-bold mb-2">ورودی‌های قطعات نهایی (لحاظ شده)</h4>
                                        <div className="overflow-y-auto max-h-[30vh] border border-gray-200 dark:border-gray-700 rounded-lg">
                                            <table className="min-w-full text-sm">
                                                <thead className="sticky top-0 bg-gray-100 dark:bg-gray-800">
                                                    <tr>
                                                        <th scope="col" className="px-4 py-3 text-right font-semibold">نام قطعه</th>
                                                        <th scope="col" className="px-4 py-3 text-center font-semibold">تاریخ</th>
                                                        <th scope="col" className="px-4 py-3 text-center font-semibold">تعداد</th>
                                                        <th scope="col" className="px-4 py-3 text-center font-semibold">وزن (ک‌گ)</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-200 dark:divide-gray-800">
                                                    {calculationResult.outputTransactions.length > 0 ? calculationResult.outputTransactions.map(tx => (
                                                        <tr key={tx.id}>
                                                            <td className="px-4 py-3 font-medium">{tx.partName}</td>
                                                            <td className="px-4 py-3 text-center text-xs">{new Date(tx.timestamp).toLocaleDateString('fa-IR')}</td>
                                                            <td className="px-4 py-3 text-center font-mono">{tx.quantityChange.toLocaleString('fa-IR')}</td>
                                                            <td className="px-4 py-3 text-center font-mono">{tx.weightChangeKg.toFixed(2)}</td>
                                                        </tr>
                                                    )) : (
                                                        <tr>
                                                            <td colSpan={4} className="text-center py-10 text-gray-500 dark:text-gray-400">موردی یافت نشد.</td>
