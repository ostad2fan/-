                      </div>
                  </div>
              </Modal>
          );
      };
	  
      const InventoryPage = ({ currentUser, users, parts, setParts, transactions, setTransactions, setToast, panelMode, workshops, rawMaterialTransactions, wages, onCostCreated }) => {
          const [searchTerm, setSearchTerm] = useState('');
          const [editingItem, setEditingItem] = useState(null);
          const [historyItem, setHistoryItem] = useState(null);
          const [isImportModalOpen, setIsImportModalOpen] = useState(false);
          const [isReportModalOpen, setIsReportModalOpen] = useState(false);
          const [reportData, setReportData] = useState(null);
          const [newlyReorderedPartIds, setNewlyReorderedPartIds] = useState(new Set());
          const [isAddPartFormVisible, setIsAddPartFormVisible] = useState(false);
          const [isTrackingModalOpen, setIsTrackingModalOpen] = useState(false);
          const [rawMaterials, setRawMaterials] = useState([]);
          const prevPartsRef = useRef(null);

          const effectivePermissions = useMemo(() => {
              if (panelMode === 'personal') {
                  return DEFAULT_ADMIN_PERMISSIONS;
              }
              return currentUser.permissions || {};
          }, [currentUser.permissions, panelMode]);

          useEffect(() => {
              const fetchRawMaterials = async () => {
                  try {
                      const materials = await api.getRawMaterialsList(currentUser, panelMode);
                      setRawMaterials(materials);
                  } catch (err) {
                      console.error("Failed to fetch raw materials", err);
                      setToast({ message: 'خطا در دریافت لیست مواد اولیه: ' + err.message, type: 'error' });
                  }
              };
              fetchRawMaterials();
          }, [currentUser, panelMode]);

          const handleAddPart = async (partData) => {
              try {
                  const initialQuantity = partData.quantity || 0;
                  const partToSave = { ...partData, id: crypto.randomUUID(), quantity: 0 };
                  partToSave.reorderTriggeredDate = null; 

                  await api.addPart(partToSave, currentUser, panelMode);

                  const newPartForUi = { ...partToSave, quantity: initialQuantity };
                  if (newPartForUi.reorderPoint > 0 && newPartForUi.quantity <= newPartForUi.reorderPoint) {
                      newPartForUi.reorderTriggeredDate = new Date().toISOString();
                  }

                  setParts(prevParts => [...prevParts, newPartForUi]);

                  if (initialQuantity > 0 && partData.itemsPerKg) {
                      const weight = partData.itemsPerKg > 0 ? initialQuantity / partData.itemsPerKg : 0;
                      const transactionRecord = {
                          id: crypto.randomUUID(),
                          partId: partToSave.id,
                          partName: partToSave.name,
                          operation: 'ورود',
                          quantityChange: initialQuantity,
                          weightChangeKg: weight,
                          timestamp: new Date().toISOString(),
                          snapshotQuantity: initialQuantity,
                          snapshotWeightKg: weight
                      };

                      await api.addTransaction({
                          transactionRecord,
                          partId: partToSave.id,
                          transactionQuantity: initialQuantity,
                          reorderTriggeredDate: newPartForUi.reorderTriggeredDate
                      }, currentUser, panelMode);

                      setTransactions(prev => [transactionRecord, ...prev]);
                  }

                  setToast({ message: 'کالا با موفقیت اضافه شد.', type: 'success' });
              } catch (err) {
                  setToast({ message: `خطا در افزودن کالا: ${err.message}`, type: 'error' });
              }
          };

          const handleAddPartAndCollapse = async (partData) => {
              await handleAddPart(partData);
              setIsAddPartFormVisible(false);
          };

          const handleUpdatePart = async (updatedPart) => {
              try {
                  const oldPart = parts.find(p => p.id === updatedPart.id);
                  if (!oldPart) throw new Error("Part not found");
                  
                  const newPartData = { ...updatedPart };
          
                  const needsReorderNow = newPartData.reorderPoint > 0 && newPartData.quantity <= newPartData.reorderPoint;
                  
                  if (needsReorderNow) {
                      newPartData.reorderTriggeredDate = oldPart.reorderTriggeredDate || new Date().toISOString();
                  } else {
                      newPartData.reorderTriggeredDate = null;
                  }
          
                  await api.updatePart(newPartData.id, newPartData, currentUser, panelMode);
                  setParts(parts.map(p => p.id === newPartData.id ? newPartData : p));
                  setToast({ message: 'کالا با موفقیت ویرایش شد.', type: 'success' });
              } catch (err) {
                  setToast({ message: `خطا در ویرایش کالا: ${err.message}`, type: 'error' });
              }
          };
          
          const handleDeletePart = async (partId) => {
              const partToDelete = parts.find(p => p.id === partId);
              if (partToDelete && window.confirm(`آیا از حذف "${partToDelete.name}" مطمئن هستید؟`)) {
                  try {
                      await api.deletePart(partId, currentUser, panelMode);
                      setParts(parts.filter(p => p.id !== partId));
                      setTransactions(transactions.filter(t => t.partId !== partId));
                      setToast({ message: 'کالا با موفقیت حذف شد.', type: 'success' });
                  } catch (err) {
                      setToast({ message: `خطا در حذف کالا: ${err.message}`, type: 'error' });
                  }
              }
          };

          const handleTransaction = async (partId, transactionQuantity, transactionRecord, costDestinations) => {
              try {
                  const oldPart = parts.find(p => p.id === partId);
                  if (!oldPart) throw new Error("Part not found");
          
                  const newQuantity = oldPart.quantity + transactionQuantity;
                  let newReorderDate = oldPart.reorderTriggeredDate;
          
                  const needsReorderNow = oldPart.reorderPoint > 0 && newQuantity <= oldPart.reorderPoint;
                  const wasNeedingReorderBefore = oldPart.reorderPoint > 0 && oldPart.quantity <= oldPart.reorderPoint;
          
                  if (needsReorderNow && !wasNeedingReorderBefore) {
                      newReorderDate = new Date().toISOString();
                  } else if (!needsReorderNow && wasNeedingReorderBefore) {
                      newReorderDate = null;
                  }
          
                  await api.addTransaction({ transactionRecord, partId, transactionQuantity, reorderTriggeredDate: newReorderDate, costDestinations }, currentUser, panelMode);
                  
                  setParts(parts.map(p => p.id === partId ? { ...p, quantity: newQuantity, reorderTriggeredDate: newReorderDate } : p));
                  setTransactions([transactionRecord, ...transactions]);
                  setToast({ message: 'عملیات با موفقیت ثبت شد.', type: 'success' });

                  if (costDestinations && costDestinations.length > 0) {
                      onCostCreated();
                  }
              } catch (err) {
                  setToast({ message: `خطا در ثبت عملیات: ${err.message}`, type: 'error' });
              }
          };
          
          const handleImport = async (importedItems) => {
              if (!window.confirm(`تعداد ${importedItems.length} کالا وارد خواهد شد. کالاهای با نام تکراری نادیده گرفته می‌شوند. آیا ادامه می‌دهید؟`)) return;
              setToast({message: `در حال وارد کردن ${importedItems.length} کالا...`, type: 'info'});
              let successCount = 0;
              const existingNames = new Set(parts.map(p => normalizeSearchString(p.name)));
              const newParts = [];
              const newTransactions = [];
              
              const itemsToImport = importedItems.filter(item => !existingNames.has(normalizeSearchString(item.name)));

              for (const item of itemsToImport) {
                  const newPart = { ...item, id: crypto.randomUUID() };
                  newParts.push(newPart);
                  if(item.quantity && item.quantity > 0 && item.itemsPerKg) {
                      const weight = item.itemsPerKg > 0 ? item.quantity / item.itemsPerKg : 0;
                      newTransactions.push({ id: crypto.randomUUID(), partId: newPart.id, partName: newPart.name, operation: 'ورود', quantityChange: item.quantity, weightChangeKg: weight, timestamp: new Date().toISOString(), snapshotQuantity: item.quantity, snapshotWeightKg: weight });
                  }
              }
              
              try {
                  for (const part of newParts) {
                      await api.addPart(part, currentUser, panelMode);
                      const relatedTx = newTransactions.find(tx => tx.partId === part.id);
                      if (relatedTx) {
                          await api.addTransaction({ transactionRecord: relatedTx, partId: part.id, transactionQuantity: relatedTx.quantityChange }, currentUser, panelMode);
                      }
                      successCount++;
                  }
                  if (successCount > 0) {
                    setParts(prev => [...prev, ...newParts]);
                    setTransactions(prev => [...newTransactions, ...prev]);
                    setToast({message: `${successCount} کالا با موفقیت وارد شد.`, type: 'success'});
                  } else {
                    setToast({message: 'هیچ کالای جدیدی برای وارد کردن وجود نداشت (ممکن است نام‌ها تکراری باشند).', type: 'info'});
                  }
              } catch (err) {
                  setToast({message: `خطا در هنگام وارد کردن: ${err.message}`, type: 'error'});
              }
          };

          const generateReport = (type) => {
              let headers, data, filename, title;
              if (type === 'inventory') {
                  title = "گزارش موجودی انبار";
                  headers = ["نام کالا", "تعداد", "وزن کل (ک‌گ)", "تعداد/ک‌گ", "نقطه سفارش"];
                  data = parts.map(p => [ p.name, p.quantity, (p.quantity / (p.itemsPerKg || 1)).toFixed(2), (p.itemsPerKg || 0).toFixed(2), p.reorderPoint ]);
                  filename = "inventory_report.xlsx";
              } else if (type === 'reorder') {
                  title = "گزارش کسری انبار (لیست سفارش)";
                  headers = ["نام کالا", "تعداد فعلی", "نقطه سفارش", "کسری"];
                  data = parts.filter(p => p.reorderPoint > 0 && p.quantity <= p.reorderPoint).map(p => [ p.name, p.quantity, p.reorderPoint, p.reorderPoint - p.quantity ]);
                  filename = "reorder_report.xlsx";
              }
              setReportData({ headers, data, filename, title });
              setIsReportModalOpen(true);
          };
          
          useEffect(() => {
              const prevParts = prevPartsRef.current;
              if (prevParts) { 
                  const newlyTriggered = new Set();
                  parts.forEach(currentPart => {
                      const prevPart = prevParts.find(p => p.id === currentPart.id);
                      if (prevPart && currentPart.quantity < prevPart.quantity) {
                          const justCrossedThreshold =
                              currentPart.reorderPoint > 0 &&
                              prevPart.quantity > currentPart.reorderPoint && 
                              currentPart.quantity <= currentPart.reorderPoint; 

                          if (justCrossedThreshold) {
                              newlyTriggered.add(currentPart.id);
                          }
                      }
                  });
                  
                  if (newlyTriggered.size > 0) {
                      setNewlyReorderedPartIds(prev => new Set([...prev, ...newlyTriggered]));
                  }
              }
              prevPartsRef.current = parts;
          }, [parts]);


          return (
              <div className="space-y-6">
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                      <div className="lg:col-span-1 space-y-6">
                          <TransactionForm parts={parts} onTransaction={handleTransaction} permissions={effectivePermissions} searchTerm={searchTerm} setSearchTerm={setSearchTerm} workshops={workshops} wages={wages} />
                          
                          <div className="card !p-0 overflow-hidden">
                              <div 
                                  className="flex justify-between items-center p-4 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-800/50 transition"
                                  onClick={() => setIsAddPartFormVisible(v => !v)}
                                  role="button"
                                  tabIndex="0"
                                  onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') setIsAddPartFormVisible(v => !v); }}
                                  aria-expanded={isAddPartFormVisible}
                                  aria-controls="add-part-form-container"
                              >
                                  <h3 className="text-xl font-bold">افزودن کالای جدید</h3>
                                  <svg xmlns="http://www.w3.org/2000/svg" className={`h-6 w-6 transition-transform transform ${isAddPartFormVisible ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                      <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                                  </svg>
                              </div>
                              
                              <div
                                  id="add-part-form-container"
                                  style={{
                                      display: 'grid',
                                      gridTemplateRows: isAddPartFormVisible ? '1fr' : '0fr',
                                      transition: 'grid-template-rows 0.3s ease-out',
                                  }}
                              >
                                  <div className="overflow-hidden">
                                      <div className="p-6 border-t border-gray-200 dark:border-gray-700">
                                          <AddPartForm onAddPart={handleAddPartAndCollapse} permissions={effectivePermissions} />
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </div>
                      <div className="lg:col-span-2 space-y-6">
                          <Card>
                              <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                                  <h3 className="text-xl font-bold whitespace-nowrap">لیست موجودی انبار</h3>
                                  <div className="flex-grow w-full sm:w-auto">
                                      <FormInput type="search" placeholder="جستجوی کالا..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                  </div>
                              </div>
                              <InventoryList parts={parts} searchTerm={searchTerm} permissions={effectivePermissions} onEdit={setEditingItem} onDelete={handleDeletePart} onHistory={setHistoryItem} newlyReorderedPartIds={newlyReorderedPartIds} />
                          </Card>
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <button 
                                onClick={() => generateReport('reorder')}
                                className="w-full px-4 py-3 bg-amber-500 text-white font-semibold rounded-lg shadow-md hover:bg-amber-600 transition-colors"
                            >
                                گزارش لیست سفارش
                            </button>
                            <button 
                                onClick={() => generateReport('inventory')}
                                className="w-full px-4 py-3 bg-slate-600 text-white font-semibold rounded-lg shadow-md hover:bg-slate-700 transition-colors"
                            >
                                گزارش کل انبار
                            </button>
                            <button
                                onClick={() => setIsTrackingModalOpen(true)}
                                className="w-full px-4 py-3 bg-cyan-600 text-white font-semibold rounded-lg shadow-md hover:bg-cyan-700 transition-colors"
                            >
                                ردیابی تولید
                            </button>
                            <button 
                                onClick={() => setIsImportModalOpen(true)}
                                className="flex items-center justify-center gap-3 w-full px-4 py-3 bg-teal-500 text-white font-semibold rounded-lg shadow-md hover:bg-teal-600 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
                                disabled={!effectivePermissions[Permission.CAN_ADD_ITEMS]}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                                </svg>
                                <span>وارد کردن از فایل</span>
                            </button>
                        </div>
                      </div>
                  </div>
                  
                  <GlobalHistory transactions={transactions} />
                  
                  {editingItem && <EditItemModal item={editingItem} isOpen={!!editingItem} onClose={() => setEditingItem(null)} onSave={handleUpdatePart} permissions={effectivePermissions} />}
                  {historyItem && <HistoryModal item={historyItem} transactions={transactions} isOpen={!!historyItem} onClose={() => setHistoryItem(null)} />}
                  {isImportModalOpen && <ImportModal isOpen={isImportModalOpen} onClose={() => setIsImportModalOpen(false)} onImport={handleImport} />}
                  {isReportModalOpen && <ReportModal isOpen={isReportModalOpen} onClose={() => setIsReportModalOpen(false)} reportData={reportData} />}
                  {isTrackingModalOpen && <ProductionTrackingModal isOpen={isTrackingModalOpen} onClose={() => setIsTrackingModalOpen(false)} rawMaterials={rawMaterials} parts={parts} transactions={transactions} workshops={workshops} rawMaterialTransactions={rawMaterialTransactions} />}
              </div>
          );
      };

      const App = () => {
          const [currentUser, setCurrentUser] = useLocalStorage('currentUser', null);
          const [isLoading, setIsLoading] = useState(true);
          const [page, setPage] = useLocalStorage('currentPage', 'inventory');
          const [theme, setTheme] = useLocalStorage('theme', 'light');
          const [panelMode, setPanelMode] = useLocalStorage('panelMode', 'main');

          const [parts, setParts] = useState([]);
          const [transactions, setTransactions] = useState([]);
          const [users, setUsers] = useState([]);
          const [workshops, setWorkshops] = useState([]);
          const [rawMaterialTransactions, setRawMaterialTransactions] = useState([]);
          const [wages, setWages] = useState({});
          
          const [toast, setToast] = useState(null);
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [initialLoadTimestamp, setInitialLoadTimestamp] = useState(null);
          const [showUpdateNotification, setShowUpdateNotification] = useState(false);
          const [workshopCostsIframeKey, setWorkshopCostsIframeKey] = useState(Date.now());
          
          const hasData = parts.length > 0 || transactions.length > 0 || users.length > 1;

          useEffect(() => {
              if (theme === 'dark') {
                  document.documentElement.classList.add('dark');
              } else {
                  document.documentElement.classList.remove('dark');
              }
          }, [theme]);
          
          useEffect(() => {
              const handleIframeResize = (event) => {
                  if (event.data && event.data.type === 'resize-iframe' && event.data.page) {
                      let iframeId = '';
                      if (event.data.page === 'wip_report') iframeId = 'wip-report-iframe';
                      else if (event.data.page === 'workshop_costs') iframeId = 'workshop-costs-iframe';

                      if (iframeId) {
                          const iframe = document.getElementById(iframeId);
                          if (iframe) iframe.style.height = `${event.data.height}px`;
                      }
                  }
              };
              window.addEventListener('message', handleIframeResize);
              return () => window.removeEventListener('message', handleIframeResize);
          }, []);
          
          const fetchData = useCallback(async (currentUser, panelMode) => {
              if (!currentUser) return;
              setIsLoading(true);
              setShowUpdateNotification(false);
              setInitialLoadTimestamp(null);
              try {
                  const [bootstrapData, updateData] = await Promise.all([
                      api.getBootstrapData(currentUser, panelMode),
                      panelMode === 'main' ? api.getLastUpdate() : Promise.resolve({ lastUpdate: null })
                  ]);

                  setUsers(bootstrapData.users);
                  setParts(bootstrapData.parts);
                  setTransactions(bootstrapData.transactions);
                  setWorkshops(bootstrapData.workshops || []);
                  setRawMaterialTransactions(bootstrapData.rawMaterialTransactions || []);
                  setWages(bootstrapData.wages || {});
                  if (updateData && updateData.lastUpdate) {
                      setInitialLoadTimestamp(updateData.lastUpdate);
                  }
              } catch (error) {
                  setToast({ message: "خطا در بارگذاری اطلاعات: " + error.message, type: 'error' });
              } finally {
                  setIsLoading(false);
              }
          }, []);

          useEffect(() => {
              if (!currentUser) {
                  setIsLoading(false);
                  return;
              };
              
              fetchData(currentUser, panelMode);

              const interval = setInterval(() => api.updateLastSeen(currentUser.id), 30000);
              
              const handleMessage = (event) => {
                  if (event.data && event.data.type === 'wageUpdated') {
                      console.log('Wage data updated from iframe. Refetching...');
                      setToast({ message: 'دستمزد بروزرسانی شد.', type: 'info' });
                      fetchData(currentUser, panelMode);
                  }
              };
              window.addEventListener('message', handleMessage);

              return () => {
                  clearInterval(interval);
                  window.removeEventListener('message', handleMessage);
              };
          }, [currentUser, panelMode, fetchData]);


          useEffect(() => {
              if (panelMode !== 'main' || !initialLoadTimestamp || !currentUser || currentUser.username === 'trade_master') {
                  return;
              }

              const checkForUpdates = async () => {
                  try {
                      const { lastUpdate } = await api.getLastUpdate();
                      if (lastUpdate > initialLoadTimestamp) {
                          setShowUpdateNotification(true);
                          clearInterval(intervalId);
                      }
                  } catch (error) {
                      console.error("Failed to check for updates:", error);
                  }
              };

              const intervalId = setInterval(checkForUpdates, 15000);

              return () => clearInterval(intervalId);
          }, [panelMode, initialLoadTimestamp, currentUser]);

          const handleLogin = (user) => { 
              setCurrentUser(user); 
              setPanelMode('main');
          };
          const handleLogout = () => { 
              setCurrentUser(null); 
              setPage('inventory'); 
              setPanelMode('main'); 
          };
          const toggleTheme = () => { setTheme(theme === 'dark' ? 'light' : 'dark'); };

          const handleCostCreated = () => {
              setWorkshopCostsIframeKey(Date.now());
          };

          const handleUpdateUser = useCallback(async (userId, userData) => {
                await api.updateUser(userId, userData);
                const stateUpdateData = { ...userData };
                delete stateUpdateData.password;
                setUsers(prevUsers => prevUsers.map(u => u.id === userId ? {...u, ...stateUpdateData} : u));
                if(currentUser && currentUser.id === userId) {
                    setCurrentUser(prev => ({...prev, ...stateUpdateData}));
                }
          }, [currentUser, setCurrentUser, setUsers]);

          const handleBackup = async () => {
              setToast({ message: "در حال آماده‌سازی فایل پشتیبان...", type: 'info' });
              try {
                  const response = await fetch('/api/backup', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                  });
                  if (!response.ok) {
                      const errorData = await response.json();
                      throw new Error(errorData.error || 'خطا در دریافت اطلاعات پشتیبان.');
                  }
                  const data = await response.json();
                  const jsonString = JSON.stringify(data, null, 2);
                  const blob = new Blob([jsonString], { type: 'application/json' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  const date = new Date().toISOString().slice(0, 10);
                  a.download = `anbar-backup-${date}.json`;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  URL.revokeObjectURL(url);
                  setToast({ message: "فایل پشتیبان با موفقیت دانلود شد.", type: 'success' });
              } catch (err) {
                  console.error('Backup failed:', err);
                  setToast({ message: `خطا در پشتیبان‌گیری: ${err.message}`, type: 'error' });
              }
          };
          
          const handleRestore = () => {
              if (!hasData || window.confirm("هشدار: این عمل تمام اطلاعات فعلی سیستم را با اطلاعات فایل پشتیبان جایگزین می‌کند. آیا اطمینان دارید؟")) {
                  const fileInput = document.createElement('input');
                  fileInput.type = 'file';
                  fileInput.accept = '.json';
                  fileInput.onchange = async (e) => {
                      const target = e.target;
                      if (!target.files?.length) return;
                      const file = target.files[0];
                      const reader = new FileReader();
                      reader.onload = async (event) => {
                          try {
                              if (!event.target?.result || typeof event.target.result !== 'string') return;
                              const data = JSON.parse(event.target.result);
                              setToast({ message: "در حال بازیابی اطلاعات... لطفاً منتظر بمانید.", type: 'info' });
                              await api.restore(data);
                              
                              setToast({ message: "اطلاعات با موفقیت بازیابی شد. صفحه مجدداً بارگذاری می‌شود.", type: 'success' });
                              setTimeout(() => window.location.assign(window.location.href), 2000);
                          } catch (err) {
                              setToast({ message: `خطا در بازیابی: ${err.message}`, type: 'error' });
                          }
                      };
                      reader.readAsText(file);
                  };
                  fileInput.click();
              }
          };

          if (!currentUser) {
              return <LoginPage onLogin={handleLogin} setToast={setToast}/>;
          }
          
          const iframeSrcParams = `&panelMode=${panelMode}&user=${currentUser.username}`;
          const canEditProduction = panelMode === 'personal' || (currentUser.permissions && currentUser.permissions[Permission.CAN_EDIT_PRODUCTION]);
          const canEditOutsourcing = panelMode === 'personal' || (currentUser.permissions && currentUser.permissions[Permission.CAN_EDIT_OUTSOURCING]);
          const canViewWipReport = currentUser.permissions && currentUser.permissions[Permission.CAN_VIEW_WIP_REPORT];

          return (
              <Fragment>
                  {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                  <AppHeader 
                      currentUser={currentUser} 
                      handleLogout={handleLogout} 
                      page={page} setPage={setPage}
                      panelMode={panelMode} setPanelMode={setPanelMode}
                      onBackup={handleBackup}
                      onRestore={handleRestore}
                      theme={theme} toggleTheme={toggleTheme}
                      setIsSettingsOpen={setIsSettingsOpen}
                  />
                  <main id="app-container" className="container mx-auto p-4 sm:p-6 lg:p-8">
                    {isLoading && <div className="text-center py-20 text-gray-500 dark:text-gray-400">در حال بارگذاری اطلاعات...</div>}
                    
                    <div style={{ display: isLoading ? 'none' : 'block' }}>
                        <div style={{ display: page === 'inventory' ? 'block' : 'none' }}>
                            <InventoryPage currentUser={currentUser} users={users} parts={parts} setParts={setParts} transactions={transactions} setTransactions={setTransactions} setToast={setToast} panelMode={panelMode} workshops={workshops} rawMaterialTransactions={rawMaterialTransactions} wages={wages} onCostCreated={handleCostCreated}/>
                        </div>

                        {currentUser.permissions[Permission.CAN_VIEW_PRODUCTION] && (
                            <iframe src={`./production.html?canEdit=${canEditProduction}${iframeSrcParams}`} style={{ display: page === 'production' ? 'block' : 'none' }} className="w-full h-screen border-none" title="Production"></iframe>
                        )}

                        {currentUser.permissions[Permission.CAN_VIEW_OUTSOURCING] && (
                            <iframe src={`./outsourcing.html?canEdit=${canEditOutsourcing}${iframeSrcParams}`} style={{ display: page === 'outsourcing' ? 'block' : 'none' }} className="w-full h-screen border-none" title="Outsourcing"></iframe>
                        )}

                        {canViewWipReport && (
                            <iframe src={`./wip_report.html?canEdit=${panelMode==='personal' || currentUser.permissions[Permission.CAN_EDIT_WIP_REPORT]}${iframeSrcParams}`} id="wip-report-iframe" style={{ display: page === 'wip_report' ? 'block' : 'none' }} className="w-full h-auto border-none transition-height duration-300" title="WIP Report"></iframe>
                        )}

                        <iframe key={workshopCostsIframeKey} src={`./workshop_costs.html?canEdit=true${iframeSrcParams}`} id="workshop-costs-iframe" style={{ display: page === 'workshop_costs' ? 'block' : 'none' }} className="w-full h-auto border-none transition-height duration-300" title="Workshop Costs"></iframe>
                        
                        <iframe src={`./bom.html?canEdit=true${iframeSrcParams}`} style={{ display: page === 'bom' ? 'block' : 'none' }} className="w-full h-screen border-none" title="Bill of Materials"></iframe>
                        
                        <iframe src="./calculator.html" style={{ display: page === 'calculator' ? 'block' : 'none' }} className="w-full h-screen border-none" title="Calculator"></iframe>
                    </div>
                  </main>
                  <SettingsModal 
                      isOpen={isSettingsOpen} 
                      onClose={() => setIsSettingsOpen(false)} 
                      currentUser={currentUser} 
                      users={users} setUsers={setUsers}
                      onUpdateUser={handleUpdateUser}
                      setToast={setToast}
                  />
                  {showUpdateNotification && (
                      <div className="update-notification fixed top-0 left-0 right-0 z-[100] bg-indigo-700 text-white p-4 shadow-lg flex items-center justify-center gap-6">
                          <div className="flex items-center gap-3">
                              <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                  <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                              </svg>
                              <p className="font-semibold">اطلاعات سیستم توسط مدیر بروزرسانی شده است.</p>
                          </div>
                          <button 
                              onClick={() => window.location.reload()} 
                              className="py-2 px-5 bg-white text-indigo-700 font-bold rounded-md hover:bg-indigo-100 transition-colors flex-shrink-0"
                          >
                              بارگذاری مجدد اطلاعات
                          </button>
                      </div>
                  )}
              </Fragment>
          );
      };
      
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<StrictMode><App /></StrictMode>);
    </script>
</body>
</html>
