    <script type="module">
        const urlParams = new URLSearchParams(window.location.search);
        const canEdit = urlParams.get('canEdit') === 'true';
        const panelMode = urlParams.get('panelMode');
        const user = urlParams.get('user');

        document.addEventListener('DOMContentLoaded', () => {
            const syncTheme = () => {
                try {
                    const parentHtml = window.top.document.documentElement;
                    if (parentHtml.classList.contains('dark')) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                } catch (e) {
                    console.warn("Cross-origin frame error, falling back to default dark theme.");
                    if (!document.documentElement.classList.contains('dark') && !document.documentElement.classList.contains('light')) {
                         document.documentElement.classList.add('dark');
                    }
                }
            };

            document.addEventListener('wheel', (event) => {
                if (document.activeElement.type === 'number' && document.activeElement === event.target) {
                    event.preventDefault();
                    document.activeElement.blur();
                }
            }, { passive: false });

            syncTheme();

            try {
                 const observer = new MutationObserver(syncTheme);
                 observer.observe(window.top.document.documentElement, { attributes: true, attributeFilter: ['class'] });
            } catch (e) {
                console.warn("Could not observe parent window for theme changes.");
            }
        });

        // --- API CLIENT ---
        const api = {
            async request(endpoint, options = {}) {
                const { body, ...customConfig } = options;
                const headers = { 'Content-Type': 'application/json' };

                if (panelMode === 'personal' && user) {
                    headers['X-User-DB'] = user;
                }

                const config = {
                    method: body ? 'POST' : 'GET',
                    ...customConfig,
                    headers: { ...headers, ...customConfig.headers },
                };
                if (body) config.body = JSON.stringify(body);

                try {
                    const response = await fetch(endpoint, config);
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'An unknown error occurred' }));
                        const err = new Error(errorData.error || `Request failed with status ${response.status}`);
                        alert(`خطای سرور: ${err.message}`);
                        return Promise.reject(err);
                    }
                    if (response.status === 204) return null; // No Content
                    return response.json();
                } catch (error) {
                    alert(`خطای شبکه: ${error.message}`);
                    return Promise.reject(error);
                }
            },
            bootstrap: () => api.request('/api/outsourcing/bootstrap'),
            addPart: (data) => api.request('/api/outsourcing/parts', { body: data }),
            updatePart: (id, data) => api.request(`/api/outsourcing/parts/${id}`, { method: 'PUT', body: data }),
            deletePart: (id) => api.request(`/api/outsourcing/parts/${id}`, { method: 'DELETE' }),
            addTransaction: (data) => api.request('/api/outsourcing/transactions', { body: data }),
            processTransaction: (data) => api.request('/api/outsourcing/process-transaction', { body: data }),
            updateTransaction: (id, data) => api.request(`/api/outsourcing/transactions/${id}`, { method: 'PUT', body: data }),
            resetPartStock: (id, data) => api.request(`/api/outsourcing/parts/${id}/reset-stock`, { method: 'POST', body: data }),
            globalResetFinishedStock: () => api.request('/api/outsourcing/global-reset-stock', { method: 'POST' }),
            correctScrapLog: (data) => api.request('/api/outsourcing/scrap-log/correct', { body: data }),
        };

        // --- CONSTANTS & GLOBAL STATE ---
        const FINISHED_GOODS_WAREHOUSE_ID = 'finished_goods_warehouse';

        const TransactionType = {
            ENTRY: 'ورود',
            EXIT: 'خروج',

        };

        let state = {
            parts: [],
            transactions: [],

            // UI State for modals
            selectedPart: null,

            transactionType: null,
            lastReportParams: null,
            transactionReportData: [],
            transactionReportTitle: '',
            scrapReportSort: {
                key: 'timestamp', // 'timestamp' or 'workshopName'
                direction: 'desc' // 'asc' or 'desc'
            },
        };

        const DOM = {
            inventoryContainer: document.getElementById('inventory-container'),
            partSearchInput: document.getElementById('part-search-input'),
            openAddPartBtn: document.getElementById('open-add-part-btn'),
            openReportsBtn: document.getElementById('open-reports-btn'),
            openScrapReportBtn: document.getElementById('open-scrap-report-btn'),
            globalResetBtn: document.getElementById('global-reset-btn'),
            addPartModal: { el: document.getElementById('add-part-modal'), title: document.getElementById('add-part-modal-title'), body: document.getElementById('add-part-modal-body') },
            transactionModal: { el: document.getElementById('transaction-modal'), title: document.getElementById('transaction-modal-title'), body: document.getElementById('transaction-modal-body') },
            processModal: { el: document.getElementById('process-modal'), title: document.getElementById('process-modal-title'), body: document.getElementById('process-modal-body') },
            editTransactionModal: { el: document.getElementById('edit-transaction-modal'), title: document.getElementById('edit-transaction-modal-title'), body: document.getElementById('edit-transaction-modal-body') },
            historyModal: { el: document.getElementById('history-modal'), title: document.getElementById('history-modal-title'), body: document.getElementById('history-modal-body'), footer: document.getElementById('history-modal-footer') },
            reportsModal: { el: document.getElementById('reports-modal'), body: document.getElementById('reports-modal-body') },
            transactionReportModal: { el: document.getElementById('transaction-report-modal'), title: document.getElementById('transaction-report-modal-title'), body: document.getElementById('transaction-report-modal-body'), footer: document.getElementById('transaction-report-modal-footer') },
            resetStockModal: { el: document.getElementById('reset-stock-modal'), title: document.getElementById('reset-stock-modal-title'), body: document.getElementById('reset-stock-modal-body') },
            scrapReportModal: { el: document.getElementById('scrap-report-modal'), title: document.getElementById('scrap-report-modal-title'), body: document.getElementById('scrap-report-modal-body'), footer: document.getElementById('scrap-report-modal-footer') },
            correctScrapModal: { el: document.getElementById('correct-scrap-modal'), title: document.getElementById('correct-scrap-modal-title'), body: document.getElementById('correct-scrap-modal-body') },
        };

        // --- UTILITY FUNCTIONS ---
        const normalizeSearchString = (str) => {
          // Gracefully handle non-string inputs, including numbers from Excel
          if (str === null || str === undefined) return '';
          let s = String(str).trim();

          // Persian/Arabic character normalization
          s = s.replace(/[ي]/g, 'ی').replace(/[ك]/g, 'ک').replace(/[آأإ]/g, 'ا');

          // Convert Persian/Arabic numerals to Latin numerals
          const numeralsMap = { '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4', '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9', '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9' };
          s = s.replace(/[۰-۹٠-٩]/g, char => numeralsMap[char]);

          // Collapse multiple whitespace characters into a single space
          s = s.replace(/\s+/g, ' ');

          // Convert to lowercase for case-insensitive comparison
          return s.toLowerCase();
        };
        const toShamsiDisplay = (dateStr) => {
            if (!dateStr) return '';
            try { return new Date(dateStr).toLocaleDateString('fa-IR'); } 
            catch (e) { return 'تاریخ نامعتبر'; }
        };
        
        const getPart = (partId) => state.parts.find(p => p.id === partId);
        const getWorkshop = (workshopId) => state.workshops.find(w => w.id === workshopId);
        const getSortedWorkshops = () => [...state.workshops].sort((a, b) => a.name.localeCompare(b.name, 'fa'));
        const getWorkshopName = (id) => {
            if (!id) return 'نامشخص';
            if (id === FINISHED_GOODS_WAREHOUSE_ID) return 'انبار نهایی';
            const workshop = getWorkshop(id);
            return workshop ? workshop.name : 'کارگاه حذف شده';
        };
        const isAdjustmentTx = (tx) => {
            if (!tx) return false;
            
            // Catches WIP adjustments from WIP report and individual part WIP resets
            const adjustmentDestinations = ['void', 'void_adjustment', 'reset_adjustment_void', 'void_process_out'];
            if (tx.type === TransactionType.TRANSFER && adjustmentDestinations.includes(tx.toWorkshopId)) {
                return true;
            }

            // Catches finished goods resets (both individual and global)
            const resetNotes = ["ریست دستی موجودی", "ریست کلی موجودی نهایی"];
            if (tx.type === TransactionType.EXIT && resetNotes.includes(tx.notes)) {
                return true;
            }

            return false;
        };
        
        // --- STATE MODIFICATION (API-driven) ---
        const addPart = async (partData) => {
             if (state.parts.some(p => p.name === partData.name)) {
                alert('قطعه ای با این نام از قبل وجود دارد.');
                return;
            }
            
            const stockByWorkshop = {};
            if (partData.initialStock > 0 && partData.workshopId) {
                stockByWorkshop[partData.workshopId] = partData.initialStock;
            }
            
            const newPart = {
                id: crypto.randomUUID(), name: partData.name, description: partData.description,
                isRawMaterialProduct: partData.isRawMaterialProduct, weightDefinition: partData.weightDefinition,
                stockByWorkshop, finalWorkshopIds: partData.finalWorkshopIds || [], finishedGoodsStock: 0,
            };

            try {
                await api.addPart(newPart);
                state.parts.push(newPart);

                if (partData.initialStock > 0 && partData.workshopId) {
                    const newTransaction = {
                        id: crypto.randomUUID(), partId: newPart.id, type: TransactionType.ENTRY,
                        quantity: partData.initialStock, timestamp: new Date().toISOString(),
                        toWorkshopId: partData.workshopId, notes: 'موجودی اولیه',
                    };
                    await api.addTransaction({ transaction: newTransaction });
                    state.transactions.unshift(newTransaction);
                }
                renderAll();
            } catch (error) { console.error('Failed to add part:', error); }
        };
        
        const updatePart = async (partId, partData) => {
            try {
                await api.updatePart(partId, partData);
                state.parts = state.parts.map(p => p.id === partId ? { ...p, ...partData } : p);
                renderAll();
            } catch (error) { console.error('Failed to update part:', error); }
        };

        const deletePart = async (partId) => {
            if (window.confirm('آیا برای حذف این قطعه و تمام تاریخچه آن مطمئن هستید؟')) {
                try {
                    await api.deletePart(partId);
                    state.parts = state.parts.filter(p => p.id !== partId);
                    state.transactions = state.transactions.filter(t => t.partId !== partId);
                    renderAll();
                } catch (error) { console.error('Failed to delete part:', error); }
            }
        };

        const confirmTransaction = async (partId, quantity, type, fromWorkshopId, toWorkshopId, notes, timestamp) => {
            const newTransaction = {
              id: crypto.randomUUID(), partId, type, quantity, timestamp, fromWorkshopId, toWorkshopId, notes
            };
            try {
                await api.addTransaction({ transaction: newTransaction });
                // Optimistically update UI
                state.transactions.unshift(newTransaction);
                state.parts = state.parts.map(p => {
                    if (p.id !== partId) return p;
                    const updatedPart = { ...p, stockByWorkshop: { ...(p.stockByWorkshop || {}) } };
                    if (type === TransactionType.EXIT) {
                        updatedPart.finishedGoodsStock = (updatedPart.finishedGoodsStock || 0) - quantity;
                    } else if (type === TransactionType.TRANSFER && toWorkshopId === FINISHED_GOODS_WAREHOUSE_ID && fromWorkshopId) {
                        updatedPart.stockByWorkshop[fromWorkshopId] = (updatedPart.stockByWorkshop[fromWorkshopId] || 0) - quantity;
                        updatedPart.finishedGoodsStock = (updatedPart.finishedGoodsStock || 0) + quantity;
                    } else {
                        if (type === TransactionType.ENTRY && toWorkshopId) {
                            updatedPart.stockByWorkshop[toWorkshopId] = (updatedPart.stockByWorkshop[toWorkshopId] || 0) + quantity;
                        } else if (type === TransactionType.TRANSFER && fromWorkshopId && toWorkshopId) {
                            updatedPart.stockByWorkshop[fromWorkshopId] = (updatedPart.stockByWorkshop[fromWorkshopId] || 0) - quantity;
                            updatedPart.stockByWorkshop[toWorkshopId] = (updatedPart.stockByWorkshop[toWorkshopId] || 0) + quantity;
                        }
                    }
                    return updatedPart;
                });
                renderAll();
            } catch (error) { 
                console.error('Transaction failed:', error); 
                alert('تراکنش با خطا مواجه شد. لطفا صفحه را رفرش کرده و دوباره تلاش کنید.');
            }
        };
        
        const updateTransaction = async (txId, newData) => {
             try {
                await api.updateTransaction(txId, newData);
                alert('تراکنش با موفقیت ویرایش شد. اطلاعات برای اطمینان از سرور بازخوانی می‌شود.');
                await init(); // Re-fetch all data to ensure consistency
                
                // Re-open report modal if it was open

             } catch(error) {

        // --- RENDERING ---

        };
        
        const openModal = (modalEl) => {
            if (!modalEl) return;
            modalEl.style.display = 'flex';
            const closeModalHandler = () => closeModal(modalEl);
            const handleEsc = (e) => { if (e.key === 'Escape') closeModalHandler(); };
            const handleClick = (e) => { if (e.target === modalEl || e.target.closest('[data-action="close-modal"]')) closeModalHandler(); };
            document.addEventListener('keydown', handleEsc);
            modalEl.addEventListener('click', handleClick);
            modalEl._escListener = handleEsc;
            modalEl._clickListener = handleClick;
        };

        const closeModal = (modalEl) => {
            if (!modalEl) return;
            modalEl.style.display = 'none';
            if (modalEl._escListener) document.removeEventListener('keydown', modalEl._escListener);
            if (modalEl._clickListener) modalEl.removeEventListener('click', modalEl._clickListener);
        };
        
        const printModal = (modalEl) => {
            if (!modalEl) return;
            const printHeader = modalEl.querySelector('.print-header');

                const titleEl = modalEl.querySelector('.modal-content h2[id], .modal-content h2.text-xl');
                const printTitleEl = printHeader.querySelector('.print-title');
                const printDateEl = printHeader.querySelector('.print-date');
                if (printTitleEl && titleEl) printTitleEl.textContent = titleEl.textContent;
                if (printDateEl) printDateEl.textContent = new Date().toLocaleString('fa-IR', { dateStyle: 'long', timeStyle: 'short' });
            }
            modalEl.classList.add('is-printing');
            document.body.classList.add('is-printing');
            window.print();
            modalEl.classList.remove('is-printing');
            document.body.classList.remove('is-printing');
        };
        
        const renderAddPartModal = () => {

                        <label for="to-workshop" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">به کارگاه (مقصد)</label>
                        <select id="to-workshop" name="toWorkshopId" required class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500">
                           ${sortedWorkshops.length > 0 ? sortedWorkshops.map(ws => `<option value="${ws.id}">${ws.name}</option>`).join('') : '<option value="">کارگاهی یافت نشد</option>'}
                        </select>
                    </div>
                    <div class="border-t border-slate-200 dark:border-slate-700 mt-4 pt-4 space-y-3">
                       <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                           <div>
                               <label for="process-actual-weight" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">وزن واقعی قطعه حاصل (کیلوگرم)</label>
                               <input type="number" id="process-actual-weight" name="actualResultingWeightKg" required min="0" step="any" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500"/>
                           </div>
                           <div>
                               <label for="calculated-quantity" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">تعداد محاسبه شده از وزن</label>
                               <p id="calculated-quantity" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-md font-mono text-center">-</p>
                           </div>
                       </div>
                        <p id="process-scrap-preview" class="text-sm text-center text-rose-500 dark:text-rose-400 h-4"></p>
                    </div>
                  </fieldset>
                  <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700 mt-4">
                    <button type="button" data-action="close-modal" class="px-4 py-2 bg-slate-200 dark:bg-slate-600 text-slate-800 dark:text-slate-100 rounded-md hover:bg-slate-300 dark:hover:bg-slate-500 transition-colors">لغو</button>
                    <button type="submit" ${!canEdit ? 'disabled' : ''} class="px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">ثبت پردازش</button>
                  </div>
                </form>
            `;
            
            const form = DOM.processModal.body.querySelector('#process-form');
            setupDateInputWithShamsi(form, 'process-date');
            const sourceQuantityInput = form.querySelector('#process-quantity');
            const returnedQuantityInput = form.querySelector('#returned-quantity');
            const resultingPartSelect = form.querySelector('#resulting-part');
            const actualWeightInput = form.querySelector('#process-actual-weight');
            const calculatedQtyP = form.querySelector('#calculated-quantity');
            const scrapPreviewP = form.querySelector('#process-scrap-preview');
            
            const updateWeightPreview = () => {
                const sourceQty = parseInt(sourceQuantityInput.value, 10);
                const returnedQty = parseInt(returnedQuantityInput.value, 10);
                const sourcePartDef = part.weightDefinition;
                const resultingPart = getPart(resultingPartSelect.value);
                const resultingPartDef = resultingPart?.weightDefinition;

                const clearOutputs = () => {
                    actualWeightInput.value = '';
                    calculatedQtyP.textContent = '-';
                    scrapPreviewP.textContent = '';
                };

                if (!sourcePartDef || !resultingPartDef || isNaN(sourceQty) || sourceQty <= 0) {
                    clearOutputs();
                    return;
                }

                const resultingUnitWeightKg = (resultingPartDef.weightUnit === 'g' ? resultingPartDef.baseWeight / 1000 : resultingPartDef.baseWeight) / resultingPartDef.baseQuantity;
                const sourceUnitWeightKg = (sourcePartDef.weightUnit === 'g' ? sourcePartDef.baseWeight / 1000 : sourcePartDef.baseWeight) / sourcePartDef.baseQuantity;
                
                // Bi-directional calculation for actual weight/qty
                if(document.activeElement === actualWeightInput){
                    const actualWeight = parseFloat(actualWeightInput.value);
                    if (!isNaN(actualWeight) && actualWeight >= 0){
                        const calculatedQty = Math.round(actualWeight / resultingUnitWeightKg);
                        calculatedQtyP.textContent = `~ ${calculatedQty.toLocaleString('fa-IR')} عدد`;
                        if(returnedQuantityInput.value !== String(calculatedQty)) {
                            returnedQuantityInput.value = calculatedQty;
                        }
                    } else {
                         calculatedQtyP.textContent = '-';
                    }
                } else {
                     if (!isNaN(returnedQty) && returnedQty >= 0) {
                        const expectedResultingWeightKg = returnedQty * resultingUnitWeightKg;
                        actualWeightInput.value = expectedResultingWeightKg.toFixed(3);
                        calculatedQtyP.textContent = `~ ${returnedQty.toLocaleString('fa-IR')} عدد`;
                    } else {
                        actualWeightInput.value = '';
                        calculatedQtyP.textContent = '-';
                    }
                }
                
                // Update scrap preview based on current values
                const currentReturnedQty = parseInt(returnedQuantityInput.value, 10) || 0;
                
                const sourceTotalWeightKg = sourceQty * sourceUnitWeightKg;
                const actualResultingWeightKg = parseFloat(actualWeightInput.value);
                
                if (!isNaN(actualResultingWeightKg)) {
                    const totalScrapKg = sourceTotalWeightKg - actualResultingWeightKg;
                    const expectedTotalResultWeightKg = sourceQty * resultingUnitWeightKg;
                    const processScrapKg = sourceTotalWeightKg - expectedTotalResultWeightKg;
                    const componentLossScrapKg = (sourceQty - currentReturnedQty) * resultingUnitWeightKg;

                    if (totalScrapKg > 1e-6) {
                        scrapPreviewP.textContent = `ضایعات کل: ~${totalScrapKg.toFixed(3)} ک‌گ (فرآیند: ${Math.max(0, processScrapKg).toFixed(3)}، کسری: ${Math.max(0, componentLossScrapKg).toFixed(3)})`;
                    } else {
                        scrapPreviewP.textContent = '';
                    }
                }
            };
            
            sourceQuantityInput.addEventListener('input', () => {
                returnedQuantityInput.value = sourceQuantityInput.value;
                updateWeightPreview();
            });
            returnedQuantityInput.addEventListener('input', updateWeightPreview);
            resultingPartSelect.addEventListener('change', updateWeightPreview);
            actualWeightInput.addEventListener('input', updateWeightPreview);
            updateWeightPreview();

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const dateValue = formData.get('date');
                const timestamp = new Date(dateValue + 'T' + new Date().toTimeString().slice(0,8)).toISOString();
                const data = {
                    sourcePartId: part.id,
                    fromWorkshopId: formData.get('fromWorkshopId'),
                    quantity: parseInt(formData.get('quantity'), 10), // source quantity
                    returnedQuantity: parseInt(formData.get('returnedQuantity'), 10),
                    resultingPartId: formData.get('resultingPartId'),
                    toWorkshopId: formData.get('toWorkshopId'),
                    timestamp: timestamp,
                    actualResultingWeightKg: parseFloat(formData.get('actualResultingWeightKg'))
                };

                if (isNaN(data.quantity) || data.quantity <= 0) { alert('مقدار قطعه مبدا باید یک عدد مثبت باشد.'); return; }
                if (isNaN(data.returnedQuantity) || data.returnedQuantity < 0) { alert('تعداد قطعه حاصل نامعتبر است.'); return; }
                const currentStock = part.stockByWorkshop[data.fromWorkshopId] || 0;
                if (data.quantity > currentStock) { alert(`مقدار درخواستی (${data.quantity}) بیشتر از موجودی کارگاه مبدا (${currentStock}) است.`); return; }
                if (!data.fromWorkshopId || !data.resultingPartId || !data.toWorkshopId) { alert('لطفا تمام فیلدها را پر کنید.'); return; }
                if (isNaN(data.actualResultingWeightKg) || data.actualResultingWeightKg < 0) { alert('لطفا وزن واقعی قطعه حاصل را به درستی وارد کنید.'); return; }

                e.target.querySelector('button[type="submit"]').disabled = true;
                try {
                    await api.processTransaction(data);
                    alert('پردازش با موفقیت ثبت شد. اطلاعات بروزرسانی می‌شود.');
                    closeModal(DOM.processModal.el);
                    await init(); // Re-fetch all data to ensure consistency
                } catch(error) {
                    e.target.querySelector('button[type="submit"]').disabled = false;
                }
            });
            openModal(DOM.processModal.el);
        };
        
        const renderScrapReportModal = () => {
            const today = new Date().toLocaleDateString('en-CA');
            const sortedWorkshops = getSortedWorkshops();
            DOM.scrapReportModal.body.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 no-print items-end">
                    <div class="md:col-span-2">
                        <label for="scrap-workshop-filter" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">فیلتر کارگاه</label>
                        <select id="scrap-workshop-filter" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100">
                            <option value="">همه کارگاه‌ها</option>
                            ${sortedWorkshops.map(ws => `<option value="${ws.id}">${ws.name}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label for="scrap-start-date-filter" class="flex justify-between items-baseline text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                            <span>از تاریخ</span>
                            <span class="shamsi-date-display font-normal text-xs"></span>
                        </label>
                        <input type="date" id="scrap-start-date-filter" value="${today}" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100"/>
                    </div>
                    <div>
                        <label for="scrap-end-date-filter" class="flex justify-between items-baseline text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                            <span>تا تاریخ</span>
                            <span class="shamsi-date-display font-normal text-xs"></span>
                        </label>
                        <input type="date" id="scrap-end-date-filter" value="${today}" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100"/>
                    </div>
                    <div class="self-end pb-1">
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-700 dark:text-slate-300">
                            <input type="checkbox" id="toggle-destination-col-cb" class="h-4 w-4 rounded border-slate-400 text-indigo-600 focus:ring-indigo-500">
                            <span>مخفی کردن مقصد</span>
                        </label>
                    </div>
                </div>
                <div id="scrap-report-content" class="overflow-y-auto max-h-[60vh]"></div>
            `;
            setupDateInputWithShamsi(DOM.scrapReportModal.body, 'scrap-start-date-filter');
            setupDateInputWithShamsi(DOM.scrapReportModal.body, 'scrap-end-date-filter');
            const updateScrapView = () => {
                const workshopFilter = DOM.scrapReportModal.body.querySelector('#scrap-workshop-filter').value;
                const startDate = DOM.scrapReportModal.body.querySelector('#scrap-start-date-filter').value;
                const endDate = DOM.scrapReportModal.body.querySelector('#scrap-end-date-filter').value;
                const hideDestination = DOM.scrapReportModal.body.querySelector('#toggle-destination-col-cb').checked;
                
                const sortCheckbox = DOM.scrapReportModal.body.querySelector('#scrap-sort-by-workshop-cb');
                const sortByWorkshop = sortCheckbox?.checked;

                if (sortByWorkshop) {
                    state.scrapReportSort = { key: 'workshopName', direction: 'asc' };
                } else {
                    state.scrapReportSort = { key: 'timestamp', direction: 'desc' };
                }

                let filteredLogs = state.scrapLog.filter(log => log.scrap_kg > 1e-6); // Only show logs with actual scrap
                if(workshopFilter) filteredLogs = filteredLogs.filter(log => log.workshopId === workshopFilter);
                if (startDate) filteredLogs = filteredLogs.filter(log => log.timestamp.substring(0, 10) >= startDate);
                if (endDate) filteredLogs = filteredLogs.filter(log => log.timestamp.substring(0, 10) <= endDate);

                // Sorting
                filteredLogs.sort((a, b) => {
                    if (state.scrapReportSort.key === 'workshopName') {
                        const nameA = getWorkshopName(a.workshopId);
                        const nameB = getWorkshopName(b.workshopId);
                        if (nameA < nameB) return state.scrapReportSort.direction === 'asc' ? -1 : 1;
                        if (nameA > nameB) return state.scrapReportSort.direction === 'asc' ? 1 : -1;
                        return new Date(b.timestamp) - new Date(a.timestamp); // Secondary sort by date
                    } else { // default to timestamp
                        return state.scrapReportSort.direction === 'asc'
                            ? new Date(a.timestamp) - new Date(b.timestamp)
                            : new Date(b.timestamp) - new Date(a.timestamp);
                    }
                });


                const contentEl = DOM.scrapReportModal.body.querySelector('#scrap-report-content');
                if (filteredLogs.length === 0) {
                    contentEl.innerHTML = `<p class="text-center text-slate-500 dark:text-slate-400 py-6">هیچ ضایعاتی برای این بازه زمانی یافت نشد.</p>`;
                    return;
                }
                contentEl.innerHTML = `
                    <table class="w-full text-sm text-right">
                        <thead class="text-xs text-slate-700 dark:text-slate-300 uppercase bg-slate-100 dark:bg-slate-700 sticky top-0">
                            <tr>
                                <th class="px-4 py-3">
                                    <label for="scrap-sort-by-workshop-cb" class="flex items-center gap-2 cursor-pointer">
                                        <input type="checkbox" id="scrap-sort-by-workshop-cb" class="h-4 w-4 rounded border-slate-400 text-indigo-600 focus:ring-indigo-500" ${sortByWorkshop ? 'checked' : ''}>
                                        <span>کارگاه مبدا</span>
                                    </label>
                                </th>
                                <th class="px-4 py-3 toggle-destination-col">کارگاه مقصد</th>
                                <th class="px-4 py-3">تاریخ</th>
                                <th class="px-4 py-3">شرح</th>
                                <th class="px-4 py-3 text-center">مقدار ضایعات (کیلوگرم)</th>
                                <th class="px-4 py-3 text-center no-print">عملیات</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white dark:bg-slate-800 divide-y divide-slate-200 dark:divide-slate-700">
                        ${filteredLogs.map(log => {
                            const highlightClass = log.type === 'CONVERSION' && log.sourceQuantity > log.returnedQuantity ? 'bg-rose-50 dark:bg-rose-900/40' : '';
                            return `
                            <tr data-log-id="${log.id}" class="${highlightClass}">
                                <td class="px-4 py-2 font-semibold text-slate-800 dark:text-slate-100">${getWorkshopName(log.workshopId)}</td>
                                <td class="px-4 py-2 font-semibold text-slate-800 dark:text-slate-100 toggle-destination-col">${getWorkshopName(log.destinationWorkshopId)}</td>
                                <td class="px-4 py-2 text-slate-600 dark:text-slate-400">${new Date(log.timestamp).toLocaleDateString('fa-IR')}</td>
                                <td class="px-4 py-2 text-slate-600 dark:text-slate-400 text-xs">${log.process_description}</td>
                                <td class="px-4 py-2 text-center font-mono font-bold text-rose-600 dark:text-rose-400">${log.scrap_kg.toFixed(3)}</td>
                                <td class="px-4 py-2 text-center no-print">
                                    <button data-action="correct-scrap" ${!canEdit || log.type !== 'CONVERSION' || (log.sourceQuantity <= log.returnedQuantity) ? 'disabled' : ''} class="px-2 py-1 text-xs bg-amber-500 text-white rounded hover:bg-amber-600 disabled:opacity-50 disabled:cursor-not-allowed">اصلاح</button>
                                </td>
                            </tr>
                        `}).join('')}
                        </tbody>
                    </table>
                `;
                const table = contentEl.querySelector('table');
                if (table) {
                    table.classList.toggle('destination-hidden', hideDestination);
                    table.querySelector('#scrap-sort-by-workshop-cb')?.addEventListener('change', updateScrapView);
                }
            };
            
            DOM.scrapReportModal.body.querySelector('#scrap-workshop-filter').addEventListener('change', updateScrapView);
            DOM.scrapReportModal.body.querySelector('#scrap-start-date-filter').addEventListener('change', updateScrapView);
            DOM.scrapReportModal.body.querySelector('#scrap-end-date-filter').addEventListener('change', updateScrapView);
            DOM.scrapReportModal.body.querySelector('#toggle-destination-col-cb').addEventListener('change', updateScrapView);
            
            updateScrapView();
            
            DOM.scrapReportModal.footer.innerHTML = `<button id="print-scrap-report-btn" class="flex items-center gap-2 px-4 py-2 bg-slate-500 text-white font-semibold rounded-lg hover:bg-slate-600">پرینت</button>`;
            DOM.scrapReportModal.footer.querySelector('#print-scrap-report-btn').addEventListener('click', () => {
                 const modalEl = DOM.scrapReportModal.el;
                const printHeader = modalEl.querySelector('.print-header');
                const printTitleEl = printHeader.querySelector('.print-title');
                
                const workshopFilterSelect = DOM.scrapReportModal.body.querySelector('#scrap-workshop-filter');
                const selectedWorkshopName = workshopFilterSelect.value ? workshopFilterSelect.options[workshopFilterSelect.selectedIndex].text : "همه کارگاه‌ها";
                printTitleEl.textContent = `گزارش ضایعات برای: ${selectedWorkshopName}`;

                printModal(modalEl);
            });
            
            DOM.scrapReportModal.body.addEventListener('click', e => {
                const button = e.target.closest('button[data-action="correct-scrap"]');
                if (!button) return;
                const logId = button.closest('tr').dataset.logId;
                const log = state.scrapLog.find(l => l.id === logId);
                if (log) {
                    state.editingScrapLog = log;
                    renderScrapCorrectionModal();
                }
            });
            openModal(DOM.scrapReportModal.el);
        };
        
        const renderScrapCorrectionModal = () => {
            const log = state.editingScrapLog;
            if (!log) return;
            const resultingPart = getPart(log.resultingPartId);
            if (!resultingPart?.weightDefinition) {
                alert('امکان اصلاح وجود ندارد. قطعه مقصد این فرآیند تعریف وزن ندارد.');
                return;
            }

            const missingPieces = log.sourceQuantity - log.returnedQuantity;

            DOM.correctScrapModal.title.textContent = `اصلاح ضایعات (${missingPieces} قطعه کسری)`;
            DOM.correctScrapModal.body.innerHTML = `
                <form id="correct-scrap-form" class="space-y-4">
                    <fieldset ${!canEdit ? 'disabled' : ''}>
                        <div class="p-3 bg-slate-100 dark:bg-slate-800/50 rounded-lg">
                            <p class="text-sm">ضایعات فعلی از تبدیل ${log.sourceQuantity} عدد <strong>${getPart(log.sourcePartId)?.name}</strong> به <strong>${resultingPart.name}</strong>:</p>
                            <p class="text-center font-mono text-xl font-bold text-rose-500 dark:text-rose-400">${log.scrap_kg.toFixed(3)} کیلوگرم</p>
                        </div>
                        <div>
                            <label for="recovered-qty" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">تعداد قطعه <span class="font-bold text-emerald-600">${resultingPart.name}</span> بازیابی شده (حداکثر: ${missingPieces}):</label>
                            <input type="number" id="recovered-qty" name="recoveredQuantity" required min="1" max="${missingPieces}" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500"/>
                        </div>
                        <p id="recovered-weight-preview" class="text-sm text-center h-4"></p>
                        <div class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-600 space-y-2">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="change-destination-checkbox" class="h-4 w-4 rounded border-slate-400 text-indigo-600 focus:ring-indigo-500">
                                <span class="text-sm font-medium text-slate-700 dark:text-slate-300">تغییر کارگاه مقصد برای قطعات بازیابی شده</span>
                            </label>
                            <select id="new-destination-workshop" name="newDestinationWorkshopId" class="w-full p-2 border border-slate-300 dark:border-slate-600 rounded-md bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 hidden">
                                <!-- Options will be populated by JS -->
                            </select>
                        </div>
                    </fieldset>
                    <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-700 mt-4">
                        <button type="button" data-action="close-modal" class="px-4 py-2 bg-slate-200 dark:bg-slate-600 text-slate-800 dark:text-slate-100 rounded-md hover:bg-slate-300 dark:hover:bg-slate-500 transition-colors">انصراف</button>
                        <button type="submit" ${!canEdit ? 'disabled' : ''} class="px-4 py-2 bg-emerald-600 text-white rounded-md hover:bg-emerald-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">ثبت بازیابی</button>
                    </div>
                </form>
            `;

            const form = DOM.correctScrapModal.body.querySelector('#correct-scrap-form');
            const qtyInput = form.querySelector('#recovered-qty');
            const weightPreview = form.querySelector('#recovered-weight-preview');
            const submitBtn = form.querySelector('button[type="submit"]');
            const checkbox = form.querySelector('#change-destination-checkbox');
            const workshopSelect = form.querySelector('#new-destination-workshop');
            const sortedWorkshops = getSortedWorkshops();

            workshopSelect.innerHTML = sortedWorkshops.map(ws => `<option value="${ws.id}" ${ws.id === log.destinationWorkshopId ? 'selected' : ''}>${ws.name}</option>`).join('');
            workshopSelect.innerHTML += `<option value="${FINISHED_GOODS_WAREHOUSE_ID}">انبار نهایی (محصول تمام شده)</option>`;

            checkbox.addEventListener('change', () => {
                workshopSelect.classList.toggle('hidden', !checkbox.checked);
            });
            
            const wd = resultingPart.weightDefinition;
            const unitWeightKg = (wd.weightUnit === 'g' ? wd.baseWeight / 1000 : wd.baseWeight) / wd.baseQuantity;

            qtyInput.addEventListener('input', () => {
                const qty = parseInt(qtyInput.value, 10);
                if (isNaN(qty) || qty <= 0 || qty > missingPieces) {
                    weightPreview.textContent = qty > missingPieces ? `تعداد بازیابی شده نمی‌تواند از تعداد کسری (${missingPieces}) بیشتر باشد.` : '';
                    if (qty > missingPieces) weightPreview.classList.add('text-red-500'); else weightPreview.classList.remove('text-red-500');
                    submitBtn.disabled = true;
                    return;
                }
                const weight = qty * unitWeightKg;
                weightPreview.textContent = `معادل ${weight.toFixed(3)} کیلوگرم`;
                if (weight > log.scrap_kg + 1e-6) {
                    weightPreview.classList.add('text-red-500');
                    weightPreview.textContent += ' (بیشتر از ضایعات موجود!)';
                    submitBtn.disabled = true;
                } else {
                    weightPreview.classList.remove('text-red-500');
                    submitBtn.disabled = !canEdit;
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const recoveredQuantity = parseInt(qtyInput.value, 10);
                if (isNaN(recoveredQuantity) || recoveredQuantity <= 0 || recoveredQuantity > missingPieces) return;
                
                const changeDestination = checkbox.checked;
                const newDestinationWorkshopId = changeDestination ? workshopSelect.value : null;

                submitBtn.disabled = true;
                try {
                    await api.correctScrapLog({ scrapLogId: log.id, recoveredQuantity, newDestinationWorkshopId });
                    alert('اصلاحیه ضایعات با موفقیت ثبت شد.');
                    closeModal(DOM.correctScrapModal.el);
                    await init();
                } catch(error) {
                    console.error(error);
                    submitBtn.disabled = !canEdit;
                }
            });

            openModal(DOM.correctScrapModal.el);
        };

        // --- INITIALIZATION ---
        const setupEventListeners = () => {
            DOM.openAddPartBtn.disabled = !canEdit;
            DOM.openAddPartBtn.addEventListener('click', () => { state.editingPart = null; renderAddPartModal(); });
            DOM.openReportsBtn.addEventListener('click', renderReportsModal);
            DOM.openScrapReportBtn.addEventListener('click', renderScrapReportModal);
            
            DOM.globalResetBtn.disabled = !canEdit;
            DOM.globalResetBtn.addEventListener('click', async () => {
                const partsToReset = state.parts.filter(p => {
                    const totalWip = Object.values(p.stockByWorkshop || {}).reduce((sum, qty) => sum + qty, 0);
                    return totalWip === 0 && (p.finishedGoodsStock || 0) > 0;
                });

                if (partsToReset.length === 0) {
                    alert('هیچ قطعه‌ای برای ریست کردن یافت نشد (شرایط: موجودی در گردش صفر و موجودی نهایی مثبت).');
                    return;
                }

                const confirmation = window.confirm(`تعداد ${partsToReset.length} قطعه که موجودی در گردش آنها صفر است یافت شد. آیا از صفر کردن موجودی انبار نهایی آنها اطمینان دارید؟`);
                if (confirmation) {
                    try {
                        DOM.globalResetBtn.disabled = true;
                        DOM.globalResetBtn.querySelector('span').textContent = 'در حال انجام...';
                        await api.globalResetFinishedStock();
                        alert('عملیات با موفقیت انجام شد. اطلاعات بروزرسانی می‌شود.');
                        await init();
                    } catch (error) {
                        console.error('Global reset failed:', error);
                        alert(`خطا در عملیات ریست کلی: ${error.message}`);
                    } finally {
                        DOM.globalResetBtn.disabled = !canEdit;
                        DOM.globalResetBtn.querySelector('span').textContent = 'ریست کلی موجودی نهایی';
                    }
                }
            });
            
            DOM.partSearchInput.addEventListener('input', renderInventoryList);
            DOM.inventoryContainer.addEventListener('click', (e) => {
                const button = e.target.closest('button[data-action]');
                if (!button) return;
                const partId = button.closest('tr[data-part-id]').dataset.partId;
                const part = getPart(partId);
                if (!part) return;
                state.selectedPart = part;
                state.editingTransaction = null;
                switch (button.dataset.action) {
                    case 'entry': state.transactionType = TransactionType.ENTRY; renderTransactionModal(); break;
                    case 'exit': state.transactionType = TransactionType.EXIT; renderTransactionModal(); break;
                    case 'transfer': state.transactionType = TransactionType.TRANSFER; renderTransactionModal(); break;
                    case 'process': renderProcessModal(); break;
                    case 'history': renderHistoryModal(); break;
                    case 'edit': state.editingPart = part; renderAddPartModal(); break;
                    case 'reset-stock': renderResetStockModal(part); break;
                    case 'delete': deletePart(partId); break;
                }
            });
        };
        const setupDateInputWithShamsi = (container, inputId) => {
            const dateInput = container.querySelector(`#${inputId}`);
            const shamsiDisplay = dateInput?.previousElementSibling?.querySelector('.shamsi-date-display');
            if (!dateInput || !shamsiDisplay) return;

            const updateShamsi = () => {
                if (shamsiDisplay) shamsiDisplay.textContent = toShamsiDisplay(dateInput.value);
            };

            dateInput.addEventListener('change', updateShamsi);
            dateInput.addEventListener('input', updateShamsi); // for some browsers
            updateShamsi(); // Initial call
        };

        const init = async () => {
            try {
                const data = await api.bootstrap();
                state.parts = data.parts || [];
                state.transactions = data.transactions || [];
                state.workshops = data.workshops || [];
                state.scrapLog = data.scrapLog || [];
                setupEventListeners();
                renderAll();
            } catch (error) {
                document.getElementById('inventory-container').innerHTML = `<div class="text-center p-8 bg-white dark:bg-slate-800 rounded-lg shadow-md"><p class="text-red-500 font-semibold">خطا در بارگذاری اطلاعات از سرور.<br/>${error.message}</p></div>`;
            }
        };
        init();
    </script>
</body>
</html>
