<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هزینه های کارگاه ها</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');
      
      :root {
        --bg-light: #f9fafb;
        --text-light: #111827;
        --card-bg-light: #ffffff;
        --card-border-light: #e5e7eb;
        --input-bg-light: #ffffff;
        --input-border-light: #d1d5db;

        --bg-dark: #030712;
        --text-dark: #d1d5db;
        --card-bg-dark: #111827;
        --card-border-dark: #374151;
        --input-bg-dark: #1f2937;
        --input-border-dark: #4b5563;
      }

      body {
        font-family: 'Vazirmatn', sans-serif;
        background-color: var(--bg-light);
        color: var(--text-light);
        transition: background-color 0.3s, color 0.3s;
        overflow-x: hidden;
      }
      html.dark body {
        background-color: var(--bg-dark);
        color: var(--text-dark);
      }
      
      .card {
          background-color: var(--card-bg-light);
          color: var(--text-light);
          border: 1px solid var(--card-border-light);
          border-radius: 0.75rem;
          padding: 1.5rem;
      }
       html.dark .card {
          background-color: var(--card-bg-dark);
          color: var(--text-dark);
          border-color: var(--card-border-dark);
      }
      .form-input, .form-select {
          background-color: var(--input-bg-light);
          border: 1px solid var(--input-border-light);
          color: var(--text-light);
          border-radius: 0.5rem;
      }
      html.dark .form-input, html.dark .form-select {
          background-color: var(--input-bg-dark);
          border-color: var(--input-border-dark);
          color: #f3f4f6;
      }
       .form-input:focus, .form-select:focus {
          outline: 2px solid transparent;
          outline-offset: 2px;
          border-color: #3b82f6;
          --tw-ring-color: #3b82f6;
          box-shadow: 0 0 0 2px var(--tw-ring-color);
      }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button {
          -webkit-appearance: none;
          margin: 0;
      }
      input[type=number] { -moz-appearance: textfield; }

      .tab-btn.active {
        color: #3b82f6;
        background-color: #eff6ff;
        border-color: #3b82f6;
      }
      html.dark .tab-btn.active {
        color: #60a5fa;
        background-color: #1e3a8a;
        border-color: #60a5fa;
      }
      .inner-tab-btn.active {
        color: #16a34a; /* green-600 */
        border-color: #16a34a; /* green-600 */
      }
       html.dark .inner-tab-btn.active {
        color: #4ade80; /* green-400 */
        border-color: #4ade80; /* green-400 */
      }


      .modal { display: none; }
      .modal.flex { display: flex; }

      .print-header { display: none; }
      @media print {
        body { background: white !important; color: black !important; padding: 0; margin: 0;}
        html.dark body, html.dark * { background: white !important; color: black !important; }
        .no-print { display: none !important; }
        .printable-area { display: block !important; }
        .card { box-shadow: none !important; border: 1px solid #ccc !important; padding: 1rem; }
        .print-header { display: block !important; text-align: center; margin-bottom: 1rem; border-bottom: 1px solid #ccc; padding-bottom: 1rem; }
        #app-container { padding: 0 !important; }
        .print-grid { display: grid !important; grid-template-columns: 1fr !important; gap: 1.5rem; }
        .print-summary-wrapper { grid-column: span 1; }
        .print-summary-wrapper .card > div {
             display: flex;
             flex-direction: column;
             gap: 0.5rem;
        }
        .print-summary-item {
            display: flex !important;
            justify-content: space-between;
            padding: 0.5rem;
            border-bottom: 1px dashed #ccc;
        }
        .print-summary-item p:first-child { font-weight: bold; }
        @page { size: A4; margin: 1.5cm; }
      }
    </style>
</head>
<body>
    <div id="app-container" class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Content will be rendered here by JS -->
    </div>
    <div id="modal-container"></div>

    <script type="module">
        // --- Setup & State ---
        const urlParams = new URLSearchParams(window.location.search);
        const canEdit = urlParams.get('canEdit') === 'true';
        const panelMode = urlParams.get('panelMode');
        const user = urlParams.get('user');

        const state = {
            workshops: [],
            costs: [],
            payments: [],
            wages: {},
            mainInventoryParts: [],
            selectedWorkshopId: null,
            activeInnerTab: 'statement', // 'statement' or 'wages'
            isLoading: true,
            workshopSearchTerm: '',
            wagePartSearchTerm: '',
            editingPayment: null,
            editingCost: null,
        };

        const DOM = {
            appContainer: document.getElementById('app-container'),
            modalContainer: document.getElementById('modal-container'),
        };

        // --- Theme Sync & Iframe Resize ---
        const syncTheme = () => {
            try {
                const parentHtml = window.top.document.documentElement;
                document.documentElement.classList.toggle('dark', parentHtml.classList.contains('dark'));
            } catch (e) {
                if (!document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.add('dark');
                }
            }
        };
        const sendHeightToParent = () => {
            const height = document.documentElement.scrollHeight + 20;
            if (window.parent) {
                window.parent.postMessage({ type: 'resize-iframe', height: height, page: 'workshop_costs' }, '*');
            }
        };
        
        // --- API Client ---
        const api = {
            async request(endpoint, options = {}) {
                const { body, ...customConfig } = options;
                const headers = { 'Content-Type': 'application/json' };
                if (panelMode === 'personal' && user) headers['X-User-DB'] = user;
                
                const config = { method: body ? 'POST' : 'GET', ...customConfig, headers };
                if (body) config.body = JSON.stringify(body);
                try {
                    const response = await fetch(endpoint, config);
                    if (response.status === 204) return null;
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'An unknown error occurred' }));
                        throw new Error(errorData.error || `Request failed with status ${response.status}`);
                    }
                    return response.json();
                } catch (error) {
                    alert(`خطای سرور: ${error.message}`);
                    return Promise.reject(error);
                }
            },
            getFinanceData: () => api.request('/api/workshop-finance/data'),
            addPayment: (data) => api.request('/api/workshop-finance/payments', { body: data }),
            updatePayment: (id, data) => api.request(`/api/workshop-finance/payments/${id}`, { method: 'PUT', body: data }),
            deletePayment: (id) => api.request(`/api/workshop-finance/payments/${id}`, { method: 'DELETE' }),
            addManualCost: (data) => api.request('/api/workshop-finance/costs', { body: data }),
            updateCost: (id, data) => api.request(`/api/workshop-finance/costs/${id}`, { method: 'PUT', body: data }),
            deleteCost: (id) => api.request(`/api/workshop-finance/costs/${id}`, { method: 'DELETE' }),
            setWage: (data) => api.request('/api/outsourcing/wages', { body: data }),
            deleteWage: (data) => api.request('/api/outsourcing/wages', { method: 'DELETE', body: data }),
        };

        // --- UTILS ---
        const toShamsiDisplay = (dateStr) => {
            if (!dateStr) return '';
            try { return new Date(dateStr).toLocaleDateString('fa-IR'); } 
            catch (e) { return 'تاریخ نامعتبر'; }
        };

        const normalizeSearchString = (str) => {
          if (str === null || str === undefined) return '';
          let s = String(str).trim();
          s = s.replace(/[ي]/g, 'ی').replace(/[ك]/g, 'ک');
          s = s.replace(/\s+/g, ' ');
          return s.toLowerCase();
        };

        // --- RENDER FUNCTIONS ---
        const render = () => {
            if (state.isLoading) {
                DOM.appContainer.innerHTML = `<div class="card text-center text-gray-500">در حال بارگذاری اطلاعات...</div>`;
            } else {
                renderMainLayout();
            }
            const observer = new ResizeObserver(sendHeightToParent);
            observer.observe(document.body);
            setTimeout(sendHeightToParent, 150);
        };

        const renderMainLayout = () => {
            const filteredWorkshops = state.workshopSearchTerm
                ? state.workshops.filter(w => normalizeSearchString(w.name).includes(normalizeSearchString(state.workshopSearchTerm)))
                : state.workshops;

            DOM.appContainer.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4 no-print">
                        <h1 class="text-3xl font-bold">هزینه های کارگاه‌ها</h1>
                        <input id="workshop-search" type="search" placeholder="جستجوی کارگاه..." value="${state.workshopSearchTerm}" class="form-input w-full md:w-64 px-4 py-2"/>
                    </div>
                    <div class="border-b border-gray-200 dark:border-gray-700 no-print">
                        <nav id="workshop-tabs" class="-mb-px flex space-x-4 space-x-reverse overflow-x-auto p-1">
                             ${filteredWorkshops.map(ws => `
                                <button data-id="${ws.id}" class="tab-btn whitespace-nowrap py-3 px-5 font-semibold text-sm rounded-lg border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 ${state.selectedWorkshopId === ws.id ? 'active' : ''}">
                                    ${ws.name}
                                </button>
                             `).join('')}
                        </nav>
                    </div>
                    <div id="workshop-details-container">
                        ${state.selectedWorkshopId ? renderDetailView() : `<div class="card text-center text-gray-500 no-print">یک کارگاه را برای مشاهده صورت حساب انتخاب کنید.</div>`}
                    </div>
                </div>
            `;
        };
        
        const renderDetailView = () => {
            const workshop = state.workshops.find(w => w.id === state.selectedWorkshopId);
            if (!workshop) return `<div class="card text-red-500">کارگاه یافت نشد.</div>`;

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 no-print">
                        <h2 class="text-2xl font-bold">${workshop.name}</h2>
                        <div class="flex items-center gap-2">
                             <button data-tab="statement" class="inner-tab-btn px-4 py-2 text-sm font-semibold border-b-2 ${state.activeInnerTab === 'statement' ? 'active' : 'border-transparent text-gray-500 hover:border-gray-300'}">صورت مالی</button>
                             <button data-tab="wages" class="inner-tab-btn px-4 py-2 text-sm font-semibold border-b-2 ${state.activeInnerTab === 'wages' ? 'active' : 'border-transparent text-gray-500 hover:border-gray-300'}">تعریف دستمزدها</button>
                        </div>
                        <button id="print-statement-btn" class="px-4 py-2 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 transition">چاپ صورت حساب</button>
                    </div>
                    
                    <div id="inner-tab-content">
                        ${state.activeInnerTab === 'statement' ? renderFinancialStatementTab(workshop) : renderWagesSection(workshop)}
                    </div>
                </div>
            `;
        };
        
        const renderFinancialStatementTab = (workshop) => {
            const workshopCosts = state.costs.filter(c => c.workshopId === workshop.id);
            const workshopPayments = state.payments.filter(p => p.workshopId === workshop.id);
            const totalCosts = workshopCosts.reduce((sum, c) => sum + c.totalCost, 0);
            const totalPayments = workshopPayments.reduce((sum, p) => sum + p.amount, 0);
            const balance = totalCosts - totalPayments;
            const today = new Date().toLocaleDateString('en-CA');

             return `
                <div class="printable-area space-y-6">
                    <div class="print-header">
                        <h2 class="print-title">صورت حساب کارگاه: ${workshop.name}</h2>
                        <p>تاریخ چاپ: <span class="print-date">${new Date().toLocaleString('fa-IR')}</span></p>
                    </div>
                     <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
                        <!-- Top Row: Summary & Payment Form -->
                        <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6 print-summary-wrapper">
                             <div class="card">
                                <h3 class="text-xl font-bold mb-4">خلاصه مالی</h3>
                                <div class="space-y-3">
                                    <div class="p-2 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center print-summary-item">
                                        <p class="text-sm font-semibold">جمع کل دستمزدها:</p>
                                        <p class="font-mono text-lg font-bold">${totalCosts.toLocaleString('fa-IR')} <span class="text-sm">تومان</span></p>
                                    </div>
                                    <div class="p-2 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center print-summary-item">
                                        <p class="text-sm font-semibold">جمع کل واریزی‌ها:</p>
                                        <p class="font-mono text-lg font-bold text-green-600 dark:text-green-400">${totalPayments.toLocaleString('fa-IR')} <span class="text-sm">تومان</span></p>
                                    </div>
                                    <div class="p-2 flex justify-between items-center print-summary-item">
                                        <p class="text-sm font-bold ${balance >= 0 ? 'text-red-800 dark:text-red-200' : 'text-green-800 dark:text-green-200'}">مانده حساب نهایی:</p>
                                        <p class="font-mono text-lg font-extrabold ${balance >= 0 ? 'text-red-700 dark:text-red-300' : 'text-green-700 dark:text-green-300'}">
                                            ${Math.abs(balance).toLocaleString('fa-IR')}
                                            <span class="text-sm font-sans ml-1">${balance >= 0 ? 'بدهکار' : 'طلبکار'}</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                             <div class="card no-print">
                                <h3 class="text-xl font-bold mb-4">ثبت واریزی جدید</h3>
                                <form id="add-payment-form" class="space-y-4">
                                    <input type="number" name="amount" placeholder="مبلغ (تومان)" required ${!canEdit ? 'disabled' : ''} class="block w-full px-3 py-2 form-input transition disabled:opacity-50"/>
                                    <div>
                                        <div class="flex justify-between items-baseline text-sm font-medium mb-1">
                                            <span>تاریخ واریز</span>
                                            <span class="payment-date-shamsi font-normal text-xs text-gray-500 dark:text-gray-400">${toShamsiDisplay(today)}</span>
                                        </div>
                                        <input type="date" name="paymentDate" value="${today}" required ${!canEdit ? 'disabled' : ''} class="block w-full px-3 py-2 form-input transition disabled:opacity-50"/>
                                    </div>
                                    <input type="text" name="chequeNumber" placeholder="شماره چک (اختیاری)" ${!canEdit ? 'disabled' : ''} class="block w-full px-3 py-2 form-input transition disabled:opacity-50"/>
                                    <button type="submit" ${!canEdit ? 'disabled' : ''} class="w-full px-4 py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-lg shadow-md hover:bg-blue-700 disabled:bg-gray-500 transition-colors">ثبت واریزی</button>
                                </form>
                            </div>
                        </div>

                        <!-- Bottom Row: Lists -->
                        <div class="lg:col-span-2 grid grid-cols-1 lg:grid-cols-2 gap-6 print-grid">
                            <div class="card">
                                <h3 class="text-xl font-bold mb-4">لیست دستمزدها (هزینه‌ها)</h3>
                                <div class="overflow-y-auto max-h-[60vh]">
                                    <table class="min-w-full text-sm">
                                       <thead class="sticky top-0 bg-gray-100 dark:bg-gray-800">
                                         <tr>
                                            <th class="px-3 py-2 text-right">قطعه</th>
                                            <th class="px-3 py-2 text-center">مقدار</th>
                                            <th class="px-3 py-2 text-center">دستمزد واحد</th>
                                            <th class="px-3 py-2 text-center">ارزش کل</th>
                                            <th class="px-3 py-2 text-center">تاریخ</th>
                                            <th class="px-3 py-2 text-center no-print"></th>
                                         </tr>
                                       </thead>
                                       <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                                            ${workshopCosts.length > 0 ? workshopCosts.map(cost => `
                                                <tr data-id="${cost.id}">
                                                    <td class="px-3 py-2 font-medium">${cost.partName}</td>
                                                    <td class="px-3 py-2 text-center font-mono">${cost.quantity.toLocaleString(undefined, { maximumFractionDigits: 2 })} <span class="text-xs">(${cost.costBase === 'weight' ? 'ک‌گ' : 'عدد'})</span></td>
                                                    <td class="px-3 py-2 text-center font-mono">${cost.unitWage.toLocaleString('fa-IR')}</td>
                                                    <td class="px-3 py-2 text-center font-mono font-semibold">${cost.totalCost.toLocaleString('fa-IR')}</td>
                                                    <td class="px-3 py-2 text-center text-xs">${toShamsiDisplay(cost.timestamp)}</td>
                                                    <td class="px-3 py-2 text-center no-print">
                                                        <div class="flex justify-center gap-2">
                                                            <button data-action="edit-cost" ${!canEdit || !cost.isManual ? 'disabled' : ''} class="p-1 text-amber-500 hover:bg-amber-100 rounded-full disabled:opacity-50" title="${cost.isManual ? 'ویرایش دستی هزینه' : 'هزینه اتوماتیک قابل ویرایش نیست'}"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" /><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" /></svg></button>
                                                            <button data-action="delete-cost" ${!canEdit || !cost.isManual ? 'disabled' : ''} class="p-1 text-red-500 hover:bg-red-100 rounded-full disabled:opacity-50" title="${cost.isManual ? 'حذف هزینه' : 'هزینه اتوماتیک قابل حذف نیست'}"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            `).join('') : `<tr><td colspan="6" class="text-center py-6 text-gray-500">هزینه‌ای ثبت نشده.</td></tr>`}
                                       </tbody>
                                    </table>
                                </div>
                            </div>
                            <div class="card">
                                <h3 class="text-xl font-bold mb-4">لیست واریزی‌ها</h3>
                                <div class="overflow-y-auto max-h-[60vh]">
                                    <table class="min-w-full text-sm">
                                       <thead class="sticky top-0 bg-gray-100 dark:bg-gray-800">
                                         <tr>
                                            <th class="px-3 py-2 text-right">مبلغ (تومان)</th>
                                            <th class="px-3 py-2 text-center">تاریخ</th>
                                            <th class="px-3 py-2 text-center">شماره چک</th>
                                            <th class="px-3 py-2 text-center no-print">عملیات</th>
                                         </tr>
                                       </thead>
                                       <tbody id="payments-table-body" class="divide-y divide-gray-100 dark:divide-gray-800">
                                            ${workshopPayments.length > 0 ? workshopPayments.map(p => `
                                                <tr data-id="${p.id}">
                                                    <td class="px-3 py-2 font-mono font-semibold">${p.amount.toLocaleString('fa-IR')}</td>
                                                    <td class="px-3 py-2 text-center">${toShamsiDisplay(p.paymentDate)}</td>
                                                    <td class="px-3 py-2 text-center font-mono">${p.chequeNumber || '-'}</td>
                                                    <td class="px-3 py-2 text-center no-print">
                                                        <div class="flex justify-center gap-2">
                                                            <button data-action="edit-payment" ${!canEdit ? 'disabled' : ''} class="p-1 text-amber-500 hover:bg-amber-100 rounded-full disabled:opacity-50" title="ویرایش"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" /><path fill-rule="evenodd" d="M2 6a2 2 0 012-2h4a1 1 0 010 2H4v10h10v-4a1 1 0 112 0v4a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" clip-rule="evenodd" /></svg></button>
                                                            <button data-action="delete-payment" ${!canEdit ? 'disabled' : ''} class="p-1 text-red-500 hover:bg-red-100 rounded-full disabled:opacity-50" title="حذف"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            `).join('') : `<tr><td colspan="4" class="text-center py-6 text-gray-500">پرداختی ثبت نشده.</td></tr>`}
                                       </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                 </div>`;
        };
        
        const renderWagesSection = (workshop) => {
            const workshopWages = state.wages[workshop.id] || {};
            const searchTerm = normalizeSearchString(state.wagePartSearchTerm);
            const partsWithWages = Object.keys(workshopWages)
                .map(partId => state.mainInventoryParts.find(p => p.id === partId))
                .filter(Boolean)
                .filter(p => !searchTerm || normalizeSearchString(p.name).includes(searchTerm))
                .sort((a, b) => a.name.localeCompare(b.name, 'fa'));

            return `
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                    <div class="card">
                        <h3 class="text-xl font-bold mb-4">تعریف / ویرایش دستمزدها</h3>
                        <div class="space-y-4">
                            <div class="relative">
                                <input id="wage-part-search" type="search" placeholder="جستجو و افزودن قطعه از انبار..." class="form-input w-full p-2" ${!canEdit ? 'disabled' : ''} />
                                <div id="wage-part-search-results" class="absolute z-20 w-full mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-md shadow-lg max-h-48 overflow-y-auto"></div>
                            </div>
                            <input id="defined-wages-search" type="search" placeholder="جستجو در دستمزدهای تعریف شده..." value="${state.wagePartSearchTerm}" class="form-input w-full p-2" />
                            <div id="defined-wages-list" class="space-y-2 max-h-[70vh] overflow-y-auto p-2 border border-gray-200 dark:border-gray-700 rounded-lg">
                               ${partsWithWages.length > 0 ? partsWithWages.map(part => `
                                    <div class="flex items-center gap-2 p-2 bg-gray-50 dark:bg-gray-800/50 rounded" data-part-id="${part.id}">
                                        <span class="flex-grow font-medium">${part.name}</span>
                                        <input type="number" value="${workshopWages[part.id]}" class="form-input w-32 text-center wage-input" placeholder="دستمزد (تومان)" ${!canEdit ? 'disabled' : ''} />
                                        <span class="wage-save-status text-green-500 opacity-0 transition-opacity">✓</span>
                                        <button data-action="delete-wage" class="p-1 text-red-500 hover:bg-red-100 rounded-full ${!canEdit ? 'opacity-50 cursor-not-allowed' : ''}" ${!canEdit ? 'disabled' : ''} title="حذف دستمزد">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                        </button>
                                    </div>
                                `).join('') : `<p class="text-center text-sm text-gray-500 p-4">برای افزودن، یک قطعه را جستجو کنید.</p>`}
                            </div>
                        </div>
                    </div>
                     <div class="card">
                        <h3 class="text-xl font-bold mb-4">ثبت دستی هزینه (موارد ضروری)</h3>
                        <form id="manual-cost-form" class="space-y-4">
                            <div class="relative">
                               <input type="search" name="part-search" placeholder="جستجو و انتخاب قطعه..." required class="form-input w-full p-2" ${!canEdit ? 'disabled' : ''} autocomplete="off"/>
                               <input type="hidden" name="partId" />
                               <div class="manual-cost-search-results absolute z-10 w-full mt-1 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-md shadow-lg max-h-48 overflow-y-auto"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="number" name="quantity" placeholder="مقدار (عدد)" class="form-input w-full p-2" ${!canEdit ? 'disabled' : ''} />
                                <input type="number" name="weight" placeholder="مقدار (ک‌گ)" class="form-input w-full p-2" ${!canEdit ? 'disabled' : ''} />
                            </div>
                            <div class="flex items-center gap-4 pl-2">
                                <span class="text-sm font-medium">مبنای محاسبه:</span>
                                <label class="flex items-center gap-1.5 cursor-pointer">
                                    <input type="radio" name="costBase" value="quantity" checked ${!canEdit ? 'disabled' : ''} /> <span>تعداد</span>
                                </label>
                                <label class="flex items-center gap-1.5 cursor-pointer">
                                    <input type="radio" name="costBase" value="weight" ${!canEdit ? 'disabled' : ''} /> <span>وزن</span>
                                </label>
                            </div>
                            <input type="number" name="unitWage" placeholder="دستمزد واحد (تومان)" required class="form-input w-full p-2" ${!canEdit ? 'disabled' : ''} />
                            <div class="p-3 bg-gray-100 dark:bg-gray-800 rounded-lg text-center">
                                <span class="text-sm">هزینه کل محاسبه شده: </span>
                                <span id="manual-cost-total" class="font-bold text-lg">۰</span>
                                <span class="text-sm"> تومان</span>
                            </div>
                            <button type="submit" class="w-full px-4 py-2.5 text-sm font-semibold text-white bg-green-600 rounded-lg shadow-md hover:bg-green-700 disabled:bg-gray-500 transition-colors" ${!canEdit ? 'disabled' : ''}>ثبت هزینه دستی</button>
                        </form>
                    </div>
                </div>
            `;
        };
        
        const renderModal = (title, content, size = 'max-w-md') => {
            const modalId = `modal-${Date.now()}`;
            const modalHTML = `
                <div id="${modalId}" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black bg-opacity-60 backdrop-blur-sm">
                    <div class="card w-full ${size} transform-gpu scale-95 opacity-0 transition-all duration-300">
                        <div class="flex justify-between items-center pb-3 border-b border-gray-200 dark:border-gray-700">
                            <h3 class="text-xl font-bold">${title}</h3>
                            <button data-action="close-modal" class="p-1 text-gray-400 hover:text-gray-600">&times;</button>
                        </div>
                        <div class="mt-4">${content}</div>
                    </div>
                </div>
            `;
            DOM.modalContainer.innerHTML = modalHTML;
            const modalEl = document.getElementById(modalId);
            setTimeout(() => modalEl.querySelector('.card').classList.add('scale-100', 'opacity-100'), 10);
            
            modalEl.addEventListener('click', e => {
                if (e.target === modalEl || e.target.closest('[data-action="close-modal"]')) {
                    DOM.modalContainer.innerHTML = '';
                }
            });
            return modalEl;
        };
        
        const renderEditPaymentModal = () => {
            const p = state.editingPayment;
            const content = `
                <form id="edit-payment-form" class="space-y-4">
                     <input type="number" name="amount" value="${p.amount}" required class="block w-full px-3 py-2 form-input"/>
                     <div>
                        <div class="flex justify-between items-baseline text-sm font-medium mb-1">
                            <span>تاریخ واریز</span>
                            <span class="payment-date-shamsi font-normal text-xs text-gray-500 dark:text-gray-400">${toShamsiDisplay(p.paymentDate)}</span>
                        </div>
                        <input type="date" name="paymentDate" value="${p.paymentDate}" required class="block w-full px-3 py-2 form-input"/>
                     </div>
                     <input type="text" name="chequeNumber" value="${p.chequeNumber || ''}" placeholder="شماره چک (اختیاری)" class="block w-full px-3 py-2 form-input"/>
                     <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                        <button type="button" data-action="close-modal" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-md">انصراف</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md">ذخیره تغییرات</button>
                     </div>
                </form>
            `;
            const modal = renderModal(`ویرایش واریزی`, content);
            
            modal.querySelector('input[name="paymentDate"]').addEventListener('change', e => {
                const shamsiEl = modal.querySelector('.payment-date-shamsi');
                if (shamsiEl) shamsiEl.textContent = toShamsiDisplay(e.target.value);
            });
        };
        
        const renderEditCostModal = () => {
            const cost = state.editingCost;
            const content = `
                <form id="edit-cost-form" class="space-y-4">
                     <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">مقدار</label>
                            <input type="number" step="any" name="quantity" value="${cost.quantity}" required class="block w-full px-3 py-2 form-input"/>
                        </div>
                        <div class="flex items-end gap-4 pl-2">
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="costBase" value="quantity" ${cost.costBase === 'quantity' ? 'checked' : ''}/> <span>عدد</span>
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="costBase" value="weight" ${cost.costBase === 'weight' ? 'checked' : ''}/> <span>ک‌گ</span>
                            </label>
                        </div>
                     </div>
                     <div>
                        <label class="block text-sm font-medium mb-1">دستمزد واحد (تومان)</label>
                        <input type="number" name="unitWage" value="${cost.unitWage}" required class="block w-full px-3 py-2 form-input"/>
                     </div>
                     <div>
                        <label class="block text-sm font-medium mb-1">ارزش کل (تومان)</label>
                        <input type="number" name="totalCost" value="${cost.totalCost}" required class="block w-full px-3 py-2 form-input"/>
                     </div>
                     <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                        <button type="button" data-action="close-modal" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-md">انصراف</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md">ذخیره تغییرات</button>
                     </div>
                </form>
            `;
            const modal = renderModal(`ویرایش دستی هزینه برای: ${cost.partName}`, content);

            const qtyInput = modal.querySelector('[name="quantity"]');
            const wageInput = modal.querySelector('[name="unitWage"]');
            const totalInput = modal.querySelector('[name="totalCost"]');
            
            const updateTotal = () => {
                const qty = parseFloat(qtyInput.value) || 0;
                const wage = parseFloat(wageInput.value) || 0;
                totalInput.value = (qty * wage).toFixed(0);
            };

            qtyInput.addEventListener('input', updateTotal);
            wageInput.addEventListener('input', updateTotal);
        };
        
        // --- EVENT HANDLERS (Delegated) ---
        const setupEventListeners = () => {
            DOM.appContainer.addEventListener('click', async e => {
                const target = e.target;
                const workshopTab = target.closest('#workshop-tabs .tab-btn');
                if (workshopTab) { state.selectedWorkshopId = workshopTab.dataset.id; render(); return; }
                
                const innerTab = target.closest('.inner-tab-btn');
                if (innerTab) { state.activeInnerTab = innerTab.dataset.tab; render(); return; }

                const printBtn = target.closest('#print-statement-btn');
                if (printBtn) { document.body.classList.add('is-printing'); window.print(); document.body.classList.remove('is-printing'); return; }

                const deletePaymentBtn = target.closest('button[data-action="delete-payment"]');
                if (deletePaymentBtn) {
                    const paymentId = deletePaymentBtn.closest('tr').dataset.id;
                    if(confirm('آیا از حذف این واریزی اطمینان دارید؟')) {
                        await api.deletePayment(paymentId);
                        init();
                    }
                    return;
                }
                const editPaymentBtn = target.closest('button[data-action="edit-payment"]');
                if (editPaymentBtn) {
                    const paymentId = editPaymentBtn.closest('tr').dataset.id;
                    state.editingPayment = state.payments.find(p => p.id === paymentId);
                    if (state.editingPayment) renderEditPaymentModal();
                    return;
                }
                const editCostBtn = target.closest('button[data-action="edit-cost"]');
                if (editCostBtn) {
                    const costId = editCostBtn.closest('tr').dataset.id;
                    state.editingCost = state.costs.find(c => c.id === costId);
                    if (state.editingCost) renderEditCostModal();
                    return;
                }
                 const deleteCostBtn = target.closest('button[data-action="delete-cost"]');
                if (deleteCostBtn) {
                    const costId = deleteCostBtn.closest('tr').dataset.id;
                    if(confirm('آیا از حذف این هزینه اطمینان دارید؟ این عمل قابل بازگشت نیست.')) {
                        await api.deleteCost(costId);
                        init(); // Reload data
                    }
                    return;
                }
                const deleteWageBtn = target.closest('button[data-action="delete-wage"]');
                if (deleteWageBtn) {
                    const partId = deleteWageBtn.closest('[data-part-id]').dataset.partId;
                    await api.deleteWage({ workshopId: state.selectedWorkshopId, partId });
                    delete state.wages[state.selectedWorkshopId][partId];
                    if (window.parent) {
                        window.parent.postMessage({ type: 'wageUpdated' }, '*');
                    }
                    render();
                    return;
                }
                const wageSearchResult = target.closest('#wage-part-search-results > div');
                if(wageSearchResult) {
                    const workshopId = state.selectedWorkshopId;
                    const partId = wageSearchResult.dataset.partId;
                    if (!state.wages[workshopId]) state.wages[workshopId] = {};
                    if (state.wages[workshopId][partId] === undefined) {
                         state.wages[workshopId][partId] = 0;
                    }
                    render();
                    document.getElementById('wage-part-search').value = '';
                    document.getElementById('wage-part-search-results').innerHTML = '';
                    return;
                }
                const manualCostSearchResult = e.target.closest('#manual-cost-form .manual-cost-search-results > div');
                if (manualCostSearchResult) {
                    const form = manualCostSearchResult.closest('form');
                    form.elements.partId.value = manualCostSearchResult.dataset.partId;
                    form.elements['part-search'].value = manualCostSearchResult.dataset.partName;
                    manualCostSearchResult.parentElement.innerHTML = '';
                }
            });

            DOM.appContainer.addEventListener('input', e => {
                if (e.target.id === 'workshop-search') {
                    state.workshopSearchTerm = e.target.value;
                    render();
                }
                 if (e.target.id === 'wage-part-search') {
                    const term = normalizeSearchString(e.target.value);
                    const resultsContainer = document.getElementById('wage-part-search-results');
                    if (!term) {
                        resultsContainer.innerHTML = ''; return;
                    }
                    const results = state.mainInventoryParts.filter(p => normalizeSearchString(p.name).includes(term));
                    resultsContainer.innerHTML = results.length > 0 ? results.map(p => `
                        <div class="p-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700" data-part-id="${p.id}">${p.name}</div>
                    `).join('') : `<div class="p-2 text-sm text-gray-500">موردی یافت نشد.</div>`;
                 }
                 if (e.target.id === 'defined-wages-search') {
                    state.wagePartSearchTerm = e.target.value;
                    render();
                 }
                const manualCostForm = e.target.closest('#manual-cost-form');
                if (manualCostForm) {
                    if(e.target.matches('[name="part-search"]')) {
                        const term = normalizeSearchString(e.target.value);
                        const resultsContainer = manualCostForm.querySelector('.manual-cost-search-results');
                         if (!term) { resultsContainer.innerHTML = ''; return; }
                         const results = state.mainInventoryParts.filter(p => normalizeSearchString(p.name).includes(term));
                         resultsContainer.innerHTML = results.length > 0 ? results.map(p => `
                            <div class="p-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700" data-part-id="${p.id}" data-part-name="${p.name}">${p.name}</div>
                        `).join('') : `<div class="p-2 text-sm text-gray-500">موردی یافت نشد.</div>`;
                    }
                    const qty = parseFloat(manualCostForm.elements.quantity.value) || 0;
                    const weight = parseFloat(manualCostForm.elements.weight.value) || 0;
                    const wage = parseFloat(manualCostForm.elements.unitWage.value) || 0;
                    const base = manualCostForm.elements.costBase.value;
                    const baseValue = base === 'quantity' ? qty : weight;
                    document.getElementById('manual-cost-total').textContent = (baseValue * wage).toLocaleString('fa-IR');
                }
            });
            
            DOM.appContainer.addEventListener('blur', async e => {
                 if (e.target.classList.contains('wage-input')) {
                    const partId = e.target.closest('[data-part-id]').dataset.partId;
                    const newWage = parseFloat(e.target.value) || 0;
                    try {
                        await api.setWage({ workshopId: state.selectedWorkshopId, partId, wage: newWage });
                        state.wages[state.selectedWorkshopId][partId] = newWage;
                        const statusEl = e.target.parentElement.querySelector('.wage-save-status');
                        statusEl.classList.remove('opacity-0');
                        setTimeout(() => statusEl.classList.add('opacity-0'), 2000);
                        
                        // Notify parent window
                        if (window.parent) {
                            window.parent.postMessage({ type: 'wageUpdated' }, '*');
                        }
                    } catch (err) { console.error('Failed to set wage', err); }
                }
            }, true);
            
            DOM.appContainer.addEventListener('submit', async e => {
                 e.preventDefault();
                 const form = e.target;
                 const button = form.querySelector('button[type="submit"]');

                 if (form.id === 'add-payment-form') {
                    button.disabled = true;
                    const paymentData = {
                        id: crypto.randomUUID(),
                        workshopId: state.selectedWorkshopId,
                        amount: parseFloat(form.elements.amount.value),
                        paymentDate: form.elements.paymentDate.value,
                        chequeNumber: form.elements.chequeNumber.value,
                        timestamp: new Date().toISOString()
                    };
                    try {
                        await api.addPayment(paymentData);
                        await init();
                    } catch (err) {
                        button.disabled = false;
                    }
                 }
                 if (form.id === 'manual-cost-form') {
                    button.disabled = true;
                    const partId = form.elements.partId.value;
                    const partName = form.elements['part-search'].value;
                    const qty = parseFloat(form.elements.quantity.value) || 0;
                    const weight = parseFloat(form.elements.weight.value) || 0;
                    const costBase = form.elements.costBase.value;
                    const unitWage = parseFloat(form.elements.unitWage.value) || 0;
                    const quantity = costBase === 'quantity' ? qty : weight;
                    
                    if (!partId || quantity <= 0 || unitWage <= 0) {
                        alert('لطفا تمام فیلدها را به درستی پر کنید.');
                        button.disabled = false;
                        return;
                    }

                    try {
                        await api.addManualCost({
                            workshopId: state.selectedWorkshopId,
                            partId, partName, quantity, costBase, unitWage,
                            totalCost: quantity * unitWage,
                        });

                        const workshopWages = state.wages[state.selectedWorkshopId] || {};
                        if (workshopWages[partId] === undefined) {
                             await api.setWage({ workshopId: state.selectedWorkshopId, partId, wage: unitWage });
                             if (window.parent) {
                                window.parent.postMessage({ type: 'wageUpdated' }, '*');
                            }
                        }

                        await init();
                    } catch(err) { button.disabled = false; }
                 }
            });

            DOM.modalContainer.addEventListener('submit', async e => {
                e.preventDefault();
                const form = e.target;
                const button = form.querySelector('button[type="submit"]');
                button.disabled = true;

                if (form.id === 'edit-payment-form') {
                    const updatedData = {
                        amount: parseFloat(form.elements.amount.value),
                        paymentDate: form.elements.paymentDate.value,
                        chequeNumber: form.elements.chequeNumber.value
                    };
                    try {
                        await api.updatePayment(state.editingPayment.id, updatedData);
                        DOM.modalContainer.innerHTML = '';
                        await init();
                    } catch (err) { console.error('Failed to update payment', err); button.disabled = false; }
                }
                if (form.id === 'edit-cost-form') {
                     const updatedData = {
                        quantity: parseFloat(form.elements.quantity.value),
                        unitWage: parseFloat(form.elements.unitWage.value),
                        totalCost: parseFloat(form.elements.totalCost.value),
                        costBase: form.elements.costBase.value,
                     };
                     try {
                        await api.updateCost(state.editingCost.id, updatedData);
                        DOM.modalContainer.innerHTML = '';
                        await init();
                     } catch(err) { console.error('Failed to update cost', err); button.disabled = false; }
                }
            });
        };

        // --- INIT & REAL-TIME LISTENER ---
        const init = async () => {
            state.isLoading = true;
            render();
            try {
                const data = await api.getFinanceData();
                state.workshops = data.workshops || [];
                state.costs = data.costs || [];
                state.payments = data.payments || [];
                state.wages = data.wages || {};
                state.mainInventoryParts = data.mainInventoryParts || [];
                
                if(!state.selectedWorkshopId && state.workshops.length > 0) {
                    state.selectedWorkshopId = state.workshops[0].id;
                } else if (state.selectedWorkshopId && !state.workshops.some(w => w.id === state.selectedWorkshopId)) {
                    state.selectedWorkshopId = state.workshops.length > 0 ? state.workshops[0].id : null;
                }

                state.isLoading = false;
                render();
            } catch (error) {
                DOM.appContainer.innerHTML = `<div class="card text-center text-red-500">${error.message}</div>`;
                sendHeightToParent();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            syncTheme();
            setupEventListeners();
            init();
        });
    </script>
</body>
</html>
